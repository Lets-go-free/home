<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiat-Krypto Brücken – Anbieter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    color: #333;
    background: linear-gradient(135deg, #1261A0 0%, #2776EA 50%, #58CCED 100%);
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1600px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #1261A0 0%, #2776EA 100%);
    color: white;
    padding: 40px 40px 30px;
    text-align: center;
  }
  .hero h1 { font-size: 2.2em; margin-bottom: 8px; line-height: 1.2; }
  .hero p { font-size: 1.1em; opacity: 0.92; }

  /* NAV */
  .nav-menu {
    background: #084387;
    padding: 8px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .nav-menu a {
    color: white;
    text-decoration: none;
    padding: 8px 18px;
    font-weight: 600;
    transition: all 0.3s;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    border: 2px solid transparent;
    font-size: 0.95em;
  }
  .nav-menu a:hover { background: #1261A0; border-color: #58CCED; }
  .nav-menu a.active { border-color: #58CCED; background: #1261A0; }

  /* SECTION */
  .section { padding: 30px 40px 40px; }

  .section h3 {
    color: #1261A0;
    font-size: 1.5em;
    margin-bottom: 20px;
    border-bottom: 3px solid #2776EA;
    padding-bottom: 10px;
  }

  /* TOOLBAR */
  .toolbar {
    background: #E3F2FD;
    border: 1px solid #BBDEFB;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
  }
  .toolbar-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
    min-width: 180px;
  }
  .toolbar-group label {
    font-size: 0.78em;
    color: #0B4A7D;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .search-input {
    border: 2px solid #90CAF9;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.92em;
    color: #333;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    background: white;
  }
  .search-input:focus { border-color: #1261A0; box-shadow: 0 0 0 3px rgba(18,97,160,0.1); }
  .search-input::placeholder { color: #90a4ae; }

  .filter-select {
    border: 2px solid #90CAF9;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 0.88em;
    color: #333;
    width: 100%;
    outline: none;
    cursor: pointer;
    background: white;
    transition: border-color 0.2s;
  }
  .filter-select:focus { border-color: #1261A0; }

  .btn-reset {
    background: white;
    border: 2px solid #1261A0;
    border-radius: 8px;
    padding: 9px 20px;
    color: #1261A0;
    font-size: 0.9em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    align-self: flex-end;
  }
  .btn-reset:hover { background: #1261A0; color: white; }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .stats-count { color: #0B4A7D; font-size: 0.88em; font-weight: 600; }
  .stats-count strong { color: #1261A0; }
  .reload-btn {
    background: none;
    border: 1px solid #BBDEFB;
    border-radius: 6px;
    padding: 5px 14px;
    color: #1261A0;
    font-size: 0.82em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reload-btn:hover { background: #E3F2FD; border-color: #1261A0; }

  /* TABLE WRAPPER */
  .table-wrapper {
    overflow: auto;
    max-height: 60vh;
    border: 1px solid #BBDEFB;
    border-radius: 12px;
  }

  table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
    font-size: 0.9em;
  }

  thead tr { position: sticky; top: 0; z-index: 10; }
  thead th {
    background: linear-gradient(180deg, #1261A0 0%, #0d5090 100%);
    color: white;
    font-weight: 600;
    font-size: 0.82em;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    padding: 12px 16px;
    text-align: left;
    white-space: nowrap;
    border-right: 1px solid rgba(255,255,255,0.15);
  }
  thead th:last-child { border-right: none; }

  tbody tr { border-bottom: 1px solid #e8f0fe; transition: background 0.15s; }
  tbody tr:nth-child(even) { background: #f5f9ff; }
  tbody tr:hover { background: #E3F2FD; }

  tbody td {
    padding: 9px 16px;
    color: #333;
    border-right: 1px solid #e8f0fe;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 320px;
    min-width: 80px;
  }
  tbody td:last-child { border-right: none; }

  /* STICKY erste 2 Spalten */
  th.sticky, td.sticky { position: sticky; z-index: 2; }
  th.sticky { z-index: 12; background: linear-gradient(180deg, #1261A0 0%, #0d5090 100%); }
  td.sticky { background: white; }
  tbody tr:nth-child(even) td.sticky { background: #f5f9ff; }
  tbody tr:hover td.sticky { background: #E3F2FD; }
  th.sticky-last, td.sticky-last {
    box-shadow: 4px 0 8px -2px rgba(18,97,160,0.2);
    border-right: 2px solid #90CAF9 !important;
  }
  th.sticky-last { box-shadow: 4px 0 8px -2px rgba(0,0,30,0.3); }

  .cell-yes { color: #2e7d32; font-weight: 700; display: block; text-align: center; font-size: 1.1em; }
  .cell-no  { color: #c62828; display: block; text-align: center; font-size: 1.1em; }
  .cell-url { color: #1261A0; text-decoration: none; font-weight: 600; }
  .cell-url:hover { text-decoration: underline; color: #2776EA; }

  mark {
    background: rgba(18,97,160,0.18);
    color: #0B4A7D;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* STATUS */
  .status-msg { text-align: center; padding: 50px 20px; color: #1261A0; font-size: 1em; }
  .spinner {
    display: inline-block;
    width: 30px; height: 30px;
    border: 3px solid #BBDEFB;
    border-top-color: #1261A0;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* FOOTER */
  .footer {
    padding: 25px 40px;
    text-align: center;
    background: #f9f9f9;
    border-top: 1px solid #e0e0e0;
    color: #888;
    font-size: 0.82em;
  }

  /* SCROLLBAR */
  .table-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
  .table-wrapper::-webkit-scrollbar-track { background: #f0f4f8; }
  .table-wrapper::-webkit-scrollbar-thumb { background: #90CAF9; border-radius: 4px; }
  .table-wrapper::-webkit-scrollbar-thumb:hover { background: #1261A0; }

  @media (max-width: 768px) {
    body { padding: 10px; }
    .hero { padding: 25px 20px 18px; }
    .hero h1 { font-size: 1.6em; }
    .section { padding: 20px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="hero">
    <h1>Fiat-Krypto Brücken</h1>
    <p>Anbieter-Übersicht – live aus Google Sheets</p>
  </div>

  <div class="nav-menu">
    <a href="index.html">🏠 Startseite</a>
    <a href="tlnswapmintlp.html">Swap &amp; Mint</a>
    <a href="fiat-krypto-bruecken.html" class="active">Fiat-Krypto Brücken</a>
  </div>

  <div class="section">
    <h3>Anbieter-Vergleich</h3>

    <div class="toolbar">
      <div class="toolbar-group" style="flex: 2; min-width: 280px;">
        <label>🔍 Suche (alle Felder)</label>
        <input type="text" id="globalSearch" class="search-input" placeholder="Suchbegriff eingeben…" oninput="applyFilters()">
      </div>
      <button class="btn-reset" onclick="resetAll()">↺ Zurücksetzen</button>
    </div>

    <div class="stats-bar">
      <div class="stats-count" id="statsCount">Lade Daten…</div>
      <button class="reload-btn" onclick="loadData()">⟳ Neu laden</button>
    </div>

    <div class="table-wrapper" id="tableWrapper">
      <div class="status-msg"><div class="spinner"></div><br>Daten werden geladen…</div>
    </div>
  </div>

  <div class="footer">
    Daten werden live aus Google Sheets geladen · TLN Protocol · Kein Finanzrat
  </div>

</div>
<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSt2zO4BSkdmcNncavp6wKcjfxLyurffq5Uv53j8hlKaNLvEWBjpP_oCRFpZDNau0utrlQlmsh2H1jX/pub?output=csv';

let allRows = [], headers = [], filterValues = {};

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i+1];
    if (c === '"') { if (inQ && n==='"') { cell+='"'; i++; } else inQ=!inQ; }
    else if (c===',' && !inQ) { row.push(cell.trim()); cell=''; }
    else if ((c==='\n'||c==='\r') && !inQ) {
      if (c==='\r'&&n==='\n') i++;
      row.push(cell.trim());
      if (row.some(v=>v!=='')) rows.push(row);
      row=[]; cell='';
    } else { cell+=c; }
  }
  if (row.length) { row.push(cell.trim()); if(row.some(v=>v!=='')) rows.push(row); }
  return rows;
}

async function loadData() {
  document.getElementById('tableWrapper').innerHTML =
    '<div class="status-msg"><div class="spinner"></div><br>Daten werden geladen…</div>';
  document.getElementById('statsCount').textContent = 'Lade…';
  try {
    const res = await fetch(CSV_URL + '&nocache=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = parseCSV(text);
    if (parsed.length < 2) throw new Error('Keine Daten gefunden');
    headers = parsed[0];
    allRows = parsed.slice(1).filter(r => r.some(v=>v!==''));
    applyFilters();
  } catch(e) {
    document.getElementById('tableWrapper').innerHTML =
      `<div class="status-msg" style="color:#c62828;">⚠️ Fehler: ${e.message}<br><small>Stelle sicher, dass das Google Sheet als Web veröffentlicht ist.</small></div>`;
    document.getElementById('statsCount').textContent = 'Fehler';
  }
}

function buildFilters() {
  filterValues = {};
  const c = document.getElementById('filterContainer');
  c.innerHTML = '';
  const fcols = [];
  headers.forEach((h,i) => {
    const vals = [...new Set(allRows.map(r=>r[i]||'').filter(v=>v!==''))];
    const isCheckbox = vals.every(v => YES.has(v.toLowerCase()) || NO.has(v.toLowerCase()));
    if (!isCheckbox && vals.length>=2 && vals.length<=25) fcols.push(i);
  });
  // Spaltenindizes merken für Filter-Suche
  window._filterColIndices = fcols;
  fcols.slice(0,5).forEach(i => {
    const vals = [...new Set(allRows.map(r=>r[i]||'').filter(v=>v!==''))].sort();
    filterValues[i] = '';
    const g = document.createElement('div');
    g.className = 'toolbar-group';
    g.style.minWidth = '140px';
    g.innerHTML = `<label>${esc(headers[i])}</label>
      <select class="filter-select" onchange="filterValues[${i}]=this.value; applyFilters()">
        <option value="">Alle</option>
        ${vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
      </select>`;
    c.appendChild(g);
  });
}

// Finde Spaltenindex anhand Spaltenname (case-insensitive, partial match)
function findCol(keywords) {
  return headers.findIndex(h =>
    keywords.some(kw => h.toLowerCase().includes(kw.toLowerCase()))
  );
}

function applyFilters() {
  const global = document.getElementById('globalSearch').value.trim().toLowerCase();

  const filtered = allRows.filter(row => {
    // Zeilen ohne Eintrag in 1. Spalte ausblenden
    if (!(row[0]||'').trim()) return false;
    // Globale Suche über alle Spalten
    if (global && !row.some(v => v.toLowerCase().includes(global))) return false;
    return true;
  });

  renderTable(filtered, global ? [global] : []);
  document.getElementById('statsCount').innerHTML =
    `<strong>${filtered.length}</strong> von <strong>${allRows.length}</strong> Einträgen`;
}

const YES = new Set(['ja','yes','✓','✔','true','wahr','1','x']);
const NO  = new Set(['nein','no','✗','✘','false','falsch','0','-']);

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function hi(text, terms) {
  let result = esc(text);
  if (!terms || !terms.length) return result;
  terms.forEach(term => {
    if (!term) return;
    result = result.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  });
  return result;
}

function renderTable(rows, terms) {
  const w = document.getElementById('tableWrapper');
  if (!rows.length) { w.innerHTML='<div class="status-msg">Keine Einträge gefunden.</div>'; return; }
  const searchTerms = Array.isArray(terms) ? terms : (terms ? [terms] : []);

  // Spalten-Klassen für sticky
  const stickyClass = (i) => {
    if (i === 0) return ' class="sticky"';
    if (i === 1) return ' class="sticky sticky-last"';
    return '';
  };

  let html = '<table><thead><tr>' +
    headers.map((h,i) => `<th${stickyClass(i)}>${esc(h)}</th>`).join('') +
    '</tr></thead><tbody>';

  rows.forEach(row => {
    html += '<tr>';
    headers.forEach((_,i) => {
      const v = row[i]||'', lc=v.toLowerCase();
      let cell;
      if (/^https?:\/\//i.test(v)) cell=`<a href="${esc(v)}" target="_blank" class="cell-url">🔗 Link</a>`;
      else if (YES.has(lc)) cell=`<span class="cell-yes">✔</span>`;
      else if (NO.has(lc))  cell=`<span class="cell-no">✘</span>`;
      else cell=hi(v,searchTerms).replace(/\n/g,'<br>');
      const isCheckbox = YES.has(lc) || NO.has(lc);
      html+=`<td${stickyClass(i)}${isCheckbox ? ' style="text-align:center;"' : ''}>${cell}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  w.innerHTML=html;

  // left-Offset der 2. Spalte nach dem Rendern setzen
  requestAnimationFrame(() => {
    const firstCols = w.querySelectorAll('th.sticky:first-child, td.sticky:first-child');
    if (firstCols.length > 0) {
      const w1 = firstCols[0].offsetWidth;
      w.querySelectorAll('.sticky-last').forEach(el => el.style.left = w1 + 'px');
      w.querySelectorAll('.sticky:not(.sticky-last)').forEach(el => el.style.left = '0px');
    }
  });
}

function resetAll() {
  document.getElementById('globalSearch').value='';
  applyFilters();
}

loadData();
</script>
</body>
</html>
