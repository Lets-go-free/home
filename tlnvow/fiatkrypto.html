<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiat-Krypto Brücken – Anbieter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    color: #333;
    background: linear-gradient(135deg, #1261A0 0%, #2776EA 50%, #58CCED 100%);
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1600px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .hero {
    background: linear-gradient(135deg, #1261A0 0%, #2776EA 100%);
    color: white;
    padding: 40px 40px 30px;
    text-align: center;
  }
  .hero h1 { font-size: 2.2em; margin-bottom: 8px; line-height: 1.2; }
  .hero p { font-size: 1.1em; opacity: 0.92; }

  .nav-menu {
    background: #084387;
    padding: 8px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .nav-menu a {
    color: white;
    text-decoration: none;
    padding: 8px 18px;
    font-weight: 600;
    transition: all 0.3s;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    border: 2px solid transparent;
    font-size: 0.95em;
  }
  .nav-menu a:hover { background: #1261A0; border-color: #58CCED; }
  .nav-menu a.active { border-color: #58CCED; background: #1261A0; }

  .section { padding: 30px 40px 40px; }
  .section h3 {
    color: #1261A0;
    font-size: 1.5em;
    margin-bottom: 20px;
    border-bottom: 3px solid #2776EA;
    padding-bottom: 10px;
  }

  .toolbar {
    background: #E3F2FD;
    border: 1px solid #BBDEFB;
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
  }
  .toolbar-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
    min-width: 280px;
  }
  .toolbar-group label {
    font-size: 0.78em;
    color: #0B4A7D;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .search-input {
    border: 2px solid #90CAF9;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.92em;
    color: #333;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    background: white;
  }
  .search-input:focus { border-color: #1261A0; box-shadow: 0 0 0 3px rgba(18,97,160,0.1); }
  .search-input::placeholder { color: #90a4ae; }

  .btn-reset {
    background: white;
    border: 2px solid #1261A0;
    border-radius: 8px;
    padding: 9px 20px;
    color: #1261A0;
    font-size: 0.9em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    align-self: flex-end;
  }
  .btn-reset:hover { background: #1261A0; color: white; }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .stats-count { color: #0B4A7D; font-size: 0.88em; font-weight: 600; }
  .stats-count strong { color: #1261A0; }
  .reload-btn {
    background: none;
    border: 1px solid #BBDEFB;
    border-radius: 6px;
    padding: 5px 14px;
    color: #1261A0;
    font-size: 0.82em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reload-btn:hover { background: #E3F2FD; border-color: #1261A0; }

  .table-wrapper {
    overflow: auto;
    max-height: 65vh;
    border: 1px solid #BBDEFB;
    border-radius: 12px;
  }

  table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
    font-size: 0.9em;
    table-layout: auto;
  }

  thead tr { position: sticky; top: 0; z-index: 10; }
  thead th {
    background: linear-gradient(180deg, #1261A0 0%, #0d5090 100%);
    color: white;
    font-weight: 600;
    font-size: 0.82em;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    padding: 12px 16px;
    text-align: left;
    white-space: nowrap;
    border-right: 1px solid rgba(255,255,255,0.15);
  }
  thead th:last-child { border-right: none; }
  thead th.col-center { text-align: center; }

  tbody tr { border-bottom: 1px solid #e8f0fe; transition: background 0.15s; }
  tbody tr:hover { filter: brightness(0.95); }

  tbody td {
    padding: 9px 16px;
    color: #333;
    border-right: 1px solid #e8f0fe;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 320px;
    min-width: 80px;
    vertical-align: top;
  }
  tbody td:last-child { border-right: none; }
  tbody td.col-center { text-align: center; }

  /* Sticky erste 2 Spalten */
  th.sticky, td.sticky { position: sticky; z-index: 2; }
  th.sticky { z-index: 12; background: linear-gradient(180deg, #1261A0 0%, #0d5090 100%); }
  td.sticky { }
  th.sticky-last, td.sticky-last {
    box-shadow: 4px 0 8px -2px rgba(18,97,160,0.2);
    border-right: 2px solid #90CAF9 !important;
  }
  th.sticky-last { box-shadow: 4px 0 8px -2px rgba(0,0,30,0.3); }

  .cell-yes { color: #2e7d32; font-weight: 700; font-size: 1.4em; line-height: 1; }
  .cell-no  { color: #c62828; font-size: 1.4em; line-height: 1; }
  .cell-url { color: #1261A0; text-decoration: none; font-weight: 600; }
  .cell-url:hover { text-decoration: underline; color: #2776EA; }

  mark {
    background: rgba(18,97,160,0.2);
    color: #0B4A7D;
    border-radius: 2px;
    padding: 0 1px;
  }

  .status-msg { text-align: center; padding: 50px 20px; color: #1261A0; font-size: 1em; }
  .spinner {
    display: inline-block;
    width: 30px; height: 30px;
    border: 3px solid #BBDEFB;
    border-top-color: #1261A0;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    padding: 25px 40px;
    text-align: center;
    background: #f9f9f9;
    border-top: 1px solid #e0e0e0;
    color: #888;
    font-size: 0.82em;
  }

  .table-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
  .table-wrapper::-webkit-scrollbar-track { background: #f0f4f8; }
  .table-wrapper::-webkit-scrollbar-thumb { background: #90CAF9; border-radius: 4px; }
  .table-wrapper::-webkit-scrollbar-thumb:hover { background: #1261A0; }

  @media (max-width: 768px) {
    body { padding: 10px; }
    .hero { padding: 25px 20px 18px; }
    .hero h1 { font-size: 1.6em; }
    .section { padding: 20px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="hero">
    <h1>Fiat-Krypto Brücken</h1>
    <p>Anbieter-Übersicht – live aus Google Sheets</p>
  </div>

  <div class="nav-menu">
    <a href="index.html">🏠 Startseite</a>
    <a href="tlnswapmintlp.html">Swap &amp; Mint</a>
    <a href="fiatkrypto.html" class="active">Fiat-Krypto Brücken</a>
  </div>

  <div class="section">
    <h3>Anbieter-Vergleich</h3>

    <div class="toolbar">
      <div class="toolbar-group">
        <label>🔍 Suche (alle Felder)</label>
        <input type="text" id="globalSearch" class="search-input" placeholder="Suchbegriff eingeben…" oninput="applyFilters()">
      </div>
      <button class="btn-reset" onclick="resetAll()">↺ Zurücksetzen</button>
    </div>

    <div class="stats-bar">
      <div class="stats-count" id="statsCount">Lade Daten…</div>
      <button class="reload-btn" onclick="loadData()">⟳ Neu laden</button>
    </div>

    <div class="table-wrapper" id="tableWrapper">
      <div class="status-msg"><div class="spinner"></div><br>Daten werden geladen…</div>
    </div>
  </div>

  <div class="footer">
    Daten werden live aus Google Sheets geladen · TLN Protocol · Kein Finanzrat
  </div>

</div>
<script>
const API_KEY      = 'AIzaSyCoqox11k_H-pWwp95RNKAadzaeAYB4ONc';
const SHEET_ID     = '1572OYI3LfaFIx1ApYdNhJmvDp5K0KuTA33Aq-zXkLA4';
const API_URL      = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?includeGridData=true&key=${API_KEY}`;

const YES = new Set(['ja','yes','true','wahr','✓','✔','1','x']);
const NO  = new Set(['nein','no','false','falsch','✗','✘','0','-']);

let allRows    = [];   // [{cells: [{value, bg, bold, italic, color, wrap}]}]
let headers    = [];   // [{value, bg}]
let centerCols = new Set();

/* ── COLOUR HELPER ─────────────────────────────────── */
function rgbFromApi(c) {
  if (!c) return null;
  const r = Math.round((c.red   || 0) * 255);
  const g = Math.round((c.green || 0) * 255);
  const b = Math.round((c.blue  || 0) * 255);
  // Weiss / fast weiss ignorieren
  if (r > 250 && g > 250 && b > 250) return null;
  return `rgb(${r},${g},${b})`;
}

function luminance(r,g,b) {
  const a = [r,g,b].map(v => {
    v /= 255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*a[0] + 0.7152*a[1] + 0.0722*a[2];
}

function textColorForBg(bg) {
  if (!bg) return null;
  const m = bg.match(/\d+/g);
  if (!m) return null;
  const lum = luminance(+m[0], +m[1], +m[2]);
  return lum < 0.35 ? '#ffffff' : '#111111';
}

/* ── LOAD ──────────────────────────────────────────── */
async function loadData() {
  document.getElementById('tableWrapper').innerHTML =
    '<div class="status-msg"><div class="spinner"></div><br>Daten werden geladen…</div>';
  document.getElementById('statsCount').textContent = 'Lade…';

  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();

    const sheet    = json.sheets[0];
    const gridData = sheet.data[0];
    const rowData  = gridData.rowData || [];

    if (rowData.length < 2) throw new Error('Keine Daten gefunden');

    // Header-Zeile
    const headerRow = rowData[0].values || [];
    headers = headerRow.map(cell => {
      const fmt  = cell.effectiveFormat || {};
      const bg   = rgbFromApi((fmt.backgroundColor));
      const val  = cell.effectiveValue?.stringValue ||
                   cell.effectiveValue?.numberValue?.toString() ||
                   cell.formattedValue || '';
      return { value: val, bg };
    });

    // Daten-Zeilen
    allRows = [];
    for (let ri = 1; ri < rowData.length; ri++) {
      const row    = rowData[ri];
      const values = row.values || [];
      const cells  = headers.map((_, ci) => {
        const cell = values[ci] || {};
        const fmt  = cell.effectiveFormat || {};
        const bg   = rgbFromApi(fmt.backgroundColor);
        const tc   = rgbFromApi(fmt.foregroundColor || fmt.foregroundColorStyle?.rgbColor);
        const bold = fmt.textFormat?.bold || false;
        const italic = fmt.textFormat?.italic || false;
        // Wert: formattedValue bevorzugen (enthält Formatierung aus Sheets)
        const val  = cell.formattedValue ||
                     cell.effectiveValue?.stringValue ||
                     (cell.effectiveValue?.numberValue !== undefined
                       ? cell.effectiveValue.numberValue.toString() : '') ||
                     '';
        return { value: val, bg, tc, bold, italic };
      });
      // Zeilen ohne 1. Spalte überspringen
      if (!cells[0].value.trim()) continue;
      allRows.push(cells);
    }

    // Checkbox-Spalten erkennen → zentrieren
    centerCols = new Set();
    headers.forEach((_,ci) => {
      const filled = allRows.map(r => r[ci]?.value || '').filter(v => v !== '');
      if (!filled.length) return;
      const boolCount = filled.filter(v => YES.has(v.toLowerCase()) || NO.has(v.toLowerCase())).length;
      if (boolCount / filled.length >= 0.5) centerCols.add(ci);
    });

    applyFilters();
  } catch(e) {
    document.getElementById('tableWrapper').innerHTML =
      `<div class="status-msg" style="color:#c62828;">⚠️ Fehler: ${e.message}<br>
       <small>API-Key oder Spreadsheet-ID prüfen, Sheet muss öffentlich sein.</small></div>`;
    document.getElementById('statsCount').textContent = 'Fehler';
  }
}

/* ── FILTER ────────────────────────────────────────── */
function applyFilters() {
  const term = document.getElementById('globalSearch').value.trim().toLowerCase();
  const filtered = allRows.filter(row => {
    if (!term) return true;
    return row.some(c => c.value.toLowerCase().includes(term));
  });
  renderTable(filtered, term);
  document.getElementById('statsCount').innerHTML =
    `<strong>${filtered.length}</strong> von <strong>${allRows.length}</strong> Einträgen`;
}

function resetAll() {
  document.getElementById('globalSearch').value = '';
  applyFilters();
}

/* ── ESCAPE / HIGHLIGHT ────────────────────────────── */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function hi(text, term) {
  if (!term) return esc(text);
  return esc(text).replace(
    new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'),
    '<mark>$1</mark>'
  );
}

/* ── STICKY CLASS ──────────────────────────────────── */
function stickyClass(i) {
  if (i === 0) return ' sticky';
  if (i === 1) return ' sticky sticky-last';
  return '';
}

/* ── RENDER ────────────────────────────────────────── */
function renderTable(rows, term) {
  const w = document.getElementById('tableWrapper');
  if (!rows.length) {
    w.innerHTML = '<div class="status-msg">Keine Einträge gefunden.</div>';
    return;
  }

  // TH
  let html = '<table><thead><tr>';
  headers.forEach((h, ci) => {
    const sc    = stickyClass(ci);
    const ctr   = centerCols.has(ci) ? ' col-center' : '';
    const style = h.bg ? ` style="background:${h.bg}; color:${textColorForBg(h.bg)||'white'};"` : '';
    html += `<th class="${sc}${ctr}"${style}>${esc(h.value)}</th>`;
  });
  html += '</tr></thead><tbody>';

  // TD
  rows.forEach(row => {
    html += '<tr>';
    headers.forEach((_, ci) => {
      const cell = row[ci] || { value:'', bg:null, tc:null, bold:false, italic:false };
      const v    = cell.value;
      const lc   = v.toLowerCase();
      const sc   = stickyClass(ci);
      const ctr  = centerCols.has(ci) ? ' col-center' : '';

      // Inline Style: Hintergrund + Textfarbe aus Sheets
      let styleProps = '';
      if (cell.bg) {
        const fg = cell.tc || textColorForBg(cell.bg) || '#111';
        styleProps += `background:${cell.bg}; color:${fg};`;
      } else if (cell.tc) {
        styleProps += `color:${cell.tc};`;
      }
      if (cell.bold)   styleProps += 'font-weight:700;';
      if (cell.italic) styleProps += 'font-style:italic;';
      const styleAttr = styleProps ? ` style="${styleProps}"` : '';

      let content;
      if (/^https?:\/\//i.test(v)) {
        content = `<a href="${esc(v)}" target="_blank" class="cell-url">🔗 Link</a>`;
      } else if (YES.has(lc)) {
        content = `<span class="cell-yes">✔</span>`;
      } else if (NO.has(lc)) {
        content = `<span class="cell-no">✘</span>`;
      } else {
        content = hi(v, term).replace(/\n/g, '<br>');
      }

      html += `<td class="${sc}${ctr}"${styleAttr}>${content}</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  w.innerHTML = html;

  // Sticky left-Offsets setzen
  requestAnimationFrame(() => {
    const first = w.querySelector('th.sticky:not(.sticky-last)');
    if (first) {
      const w1 = first.offsetWidth;
      w.querySelectorAll('.sticky-last').forEach(el => el.style.left = w1 + 'px');
      w.querySelectorAll('.sticky:not(.sticky-last)').forEach(el => el.style.left = '0px');
    }
  });
}

loadData();
</script>
</body>
</html>
