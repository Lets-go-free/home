<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruppen-Coaching - Let's go free</title>
    <style>
        /* Dein kompletter CSS-Bereich bleibt unverändert – aus Platzgründen hier nicht wiederholt */
        /* ... (alles wie bei dir) ... */
    </style>
</head>
<body>
    <!-- Dein gesamter HTML-Inhalt (Hero, Intro, Footer, Modal) bleibt 1:1 gleich wie du ihn geschickt hast -->
    <!-- Ich habe nur die Kurs-Cards und das Script angepasst -->

    <div class="container">
        <!-- ... dein ganzer Content bis zur courses-grid ... -->

        <div class="courses-section">
            <h2 style="text-align: center; margin-bottom: 40px; color: #8B7355;">Aktuelle Kurse</h2>
            <div class="courses-grid">
                <!-- Kurs 1, 2, 3 – exakt wie bei dir, nur zur Sicherheit nochmal hier -->
                <!-- (kopiere einfach deine drei course-card Blöcke hier rein – sie sind identisch) -->
            </div>
        </div>

        <!-- Footer, Disclaimer, Modal – alles wie bei dir -->
    </div>

    <!-- Registration Modal – unverändert -->
    <div class="modal" id="registrationModal"> ... </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGjwxdKwU-jloaWPTT2YKW19kb5u3T9_I",
            authDomain: "letsgofree-coaching.firebaseapp.com",
            projectId: "letsgofree-coaching",
            storageBucket: "letsgofree-coaching.firebasestorage.app",
            messagingSenderId: "982968675336",
            appId: "1:982968675336:web:4ab786d323a6cdc933b5bd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        signInAnonymously(auth)
            .then(() => console.log("✅ Anonym angemeldet – Schreibrechte vorhanden"))
            .catch(err => console.error("❌ Anonyme Anmeldung fehlgeschlagen:", err));

        async function updateSpotsUI() {
            for (let num = 1; num <= 3; num++) {
                const ref = doc(db, "kurse", `kurs${num}`);
                try {
                    const snap = await getDoc(ref);
                    if (!snap.exists()) continue;

                    let frei = Math.max(0, snap.data().freiePlaetze ?? 7);

                    const card = document.querySelector(`.course-card[data-course="${num}"]`);
                    if (!card) continue;

                    const countEl = card.querySelector('.spots-count');
                    const textEl  = card.querySelector('.spots-left');
                    const btn     = card.querySelector('.register-btn');
                    const dots    = card.querySelectorAll('.spot');

                    // SICHERHEITS-CHECK – verhindert den Crash
                    if (!countEl || !textEl || !btn) {
                        console.warn(`Kurs ${num}: Ein UI-Element fehlt! (spots-count / spots-left / register-btn)`);
                        continue;
                    }

                    countEl.textContent = frei;

                    if (frei === 0) {
                        textEl.innerHTML = 'Ausgebucht';
                        btn.disabled = true;
                        btn.textContent = 'Ausgebucht';
                    } else if (frei === 1) {
                        textEl.innerHTML = '1 Platz frei';
                        btn.disabled = false;
                        btn.textContent = 'Jetzt anmelden';
                    } else {
                        textEl.innerHTML = `${frei} Plätze frei`;
                        btn.disabled = false;
                        btn.textContent = 'Jetzt anmelden';
                    }

                    dots.forEach((dot, i) => {
                        i < 7 - frei ? dot.classList.add('filled') : dot.classList.remove('filled');
                    });

                } catch (err) {
                    console.error(`Fehler Kurs ${num}:`, err);
                }
            }
        }

        [1,2,3].forEach(n => {
            onSnapshot(doc(db, "kurse", `kurs${n}`), () => updateSpotsUI());
        });

        updateSpotsUI();

        // Deine openModal, closeModal und Form-Submit-Funktion bleiben unverändert
        // (ich habe sie aus Platzgründen weggelassen – einfach deine Version behalten)
    </script>
</body>
</html>
