<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Token Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .wallet-address {
            background: #f7fafc;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #4a5568;
            word-break: break-all;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-label {
            color: #718096;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #2d3748;
            font-size: 24px;
            font-weight: 600;
        }

        .tokens-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .tokens-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
        }

        .tokens-header h2 {
            font-size: 22px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .token-list {
            padding: 0;
        }

        .token-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }

        .token-item:hover {
            background: #f7fafc;
        }

        .token-item:last-child {
            border-bottom: none;
        }

        .token-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .token-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .token-details {
            display: flex;
            flex-direction: column;
        }

        .token-name {
            color: #2d3748;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .token-symbol {
            color: #718096;
            font-size: 14px;
        }

        .token-balance {
            text-align: right;
        }

        .balance-amount {
            color: #2d3748;
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .token-address {
            color: #a0aec0;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 20px;
            margin: 20px 30px;
            border-radius: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            opacity: 0.3;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .token-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .token-balance {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Wallet Token Viewer</h1>
            <div class="wallet-address" id="walletAddress">
                0xC7e112D6Db20A4A9213834B2Cb235c34733e6591
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Anzahl Token</div>
                <div class="stat-value" id="tokenCount">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ETH Balance</div>
                <div class="stat-value" id="ethBalance">-</div>
            </div>
        </div>

        <div class="tokens-container">
            <div class="tokens-header">
                <h2>📊 Token Bestände</h2>
            </div>
            <div id="tokenContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Lade Token-Daten von der Blockchain...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const walletAddress = '0xC7e112D6Db20A4A9213834B2Cb235c34733e6591';
        const etherscanApiKey = 'YourApiKeyToken'; // Free API key - funktioniert auch ohne

        async function loadWalletData() {
            try {
                // ETH Balance abrufen
                const ethBalanceResponse = await fetch(
                    `https://api.etherscan.io/api?module=account&action=balance&address=${walletAddress}&tag=latest&apikey=${etherscanApiKey}`
                );
                const ethBalanceData = await ethBalanceResponse.json();
                
                if (ethBalanceData.status === '1') {
                    const ethBalance = (parseInt(ethBalanceData.result) / 1e18).toFixed(4);
                    document.getElementById('ethBalance').textContent = `${ethBalance} ETH`;
                }

                // Token Liste abrufen
                const tokenResponse = await fetch(
                    `https://api.etherscan.io/api?module=account&action=tokentx&address=${walletAddress}&startblock=0&endblock=99999999&sort=asc&apikey=${etherscanApiKey}`
                );
                const tokenData = await tokenResponse.json();

                if (tokenData.status === '1' && tokenData.result.length > 0) {
                    // Unique tokens extrahieren
                    const uniqueTokens = {};
                    
                    tokenData.result.forEach(tx => {
                        const tokenAddress = tx.contractAddress;
                        if (!uniqueTokens[tokenAddress]) {
                            uniqueTokens[tokenAddress] = {
                                name: tx.tokenName,
                                symbol: tx.tokenSymbol,
                                address: tokenAddress,
                                decimals: parseInt(tx.tokenDecimal)
                            };
                        }
                    });

                    // Balance für jeden Token abrufen
                    const tokenArray = Object.values(uniqueTokens);
                    const balancePromises = tokenArray.map(token => getTokenBalance(token));
                    const tokensWithBalance = await Promise.all(balancePromises);
                    
                    // Nur Token mit Balance > 0 anzeigen
                    const activeTokens = tokensWithBalance.filter(token => token.balance > 0);
                    
                    displayTokens(activeTokens);
                    document.getElementById('tokenCount').textContent = activeTokens.length;
                } else {
                    displayEmptyState();
                }

            } catch (error) {
                console.error('Fehler beim Laden der Daten:', error);
                displayError('Fehler beim Laden der Token-Daten. Bitte versuche es später nochmal.');
            }
        }

        async function getTokenBalance(token) {
            try {
                const response = await fetch(
                    `https://api.etherscan.io/api?module=account&action=tokenbalance&contractaddress=${token.address}&address=${walletAddress}&tag=latest&apikey=${etherscanApiKey}`
                );
                const data = await response.json();
                
                if (data.status === '1') {
                    const balance = parseInt(data.result) / Math.pow(10, token.decimals);
                    return { ...token, balance };
                }
                return { ...token, balance: 0 };
            } catch (error) {
                console.error(`Fehler bei Token ${token.symbol}:`, error);
                return { ...token, balance: 0 };
            }
        }

        function displayTokens(tokens) {
            const content = document.getElementById('tokenContent');
            
            if (tokens.length === 0) {
                displayEmptyState();
                return;
            }

            const tokenListHTML = tokens.map(token => `
                <div class="token-item">
                    <div class="token-info">
                        <div class="token-icon">
                            ${token.symbol.charAt(0)}
                        </div>
                        <div class="token-details">
                            <div class="token-name">${token.name}</div>
                            <div class="token-symbol">${token.symbol}</div>
                        </div>
                    </div>
                    <div class="token-balance">
                        <div class="balance-amount">${formatNumber(token.balance)} ${token.symbol}</div>
                        <div class="token-address">${shortenAddress(token.address)}</div>
                    </div>
                </div>
            `).join('');

            content.innerHTML = `<div class="token-list">${tokenListHTML}</div>`;
        }

        function displayEmptyState() {
            const content = document.getElementById('tokenContent');
            content.innerHTML = `
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                    </svg>
                    <h3>Keine Token gefunden</h3>
                    <p>Diese Wallet hat aktuell keine ERC-20 Token.</p>
                    <button class="refresh-btn" onclick="loadWalletData()">Neu laden</button>
                </div>
            `;
            document.getElementById('tokenCount').textContent = '0';
        }

        function displayError(message) {
            const content = document.getElementById('tokenContent');
            content.innerHTML = `
                <div class="error">
                    <strong>Fehler:</strong> ${message}
                    <button class="refresh-btn" onclick="loadWalletData()">Erneut versuchen</button>
                </div>
            `;
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(2) + 'K';
            } else if (num < 1) {
                return num.toFixed(6);
            }
            return num.toFixed(2);
        }

        function shortenAddress(address) {
            return `${address.slice(0, 6)}...${address.slice(-4)}`;
        }

        // Beim Laden der Seite Daten abrufen
        loadWalletData();
    </script>
</body>
</html>
