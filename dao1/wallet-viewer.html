<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apertum Wallet Token Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chain-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .wallet-address {
            background: #f7fafc;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #4a5568;
            word-break: break-all;
            margin-top: 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-label {
            color: #718096;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #2d3748;
            font-size: 24px;
            font-weight: 600;
        }

        .tokens-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .tokens-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tokens-header h2 {
            font-size: 22px;
        }

        .refresh-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .token-list {
            padding: 0;
        }

        .token-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }

        .token-item:hover {
            background: #f7fafc;
        }

        .token-item:last-child {
            border-bottom: none;
        }

        .token-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .token-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .token-details {
            display: flex;
            flex-direction: column;
        }

        .token-name {
            color: #2d3748;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .token-symbol {
            color: #718096;
            font-size: 14px;
        }

        .token-balance {
            text-align: right;
        }

        .balance-amount {
            color: #2d3748;
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .token-address {
            color: #a0aec0;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 20px;
            margin: 20px 30px;
            border-radius: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            opacity: 0.3;
        }

        .native-token {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        @media (max-width: 768px) {
            .token-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .token-balance {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                🔐 Wallet Token Viewer
                <span class="chain-badge">Apertum Chain</span>
            </h1>
            <div class="wallet-address" id="walletAddress">
                0xC7e112D6Db20A4A9213834B2Cb235c34733e6591
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Anzahl Token</div>
                <div class="stat-value" id="tokenCount">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">APTM Balance</div>
                <div class="stat-value" id="nativeBalance">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Chain ID</div>
                <div class="stat-value">2786</div>
            </div>
        </div>

        <div class="tokens-container">
            <div class="tokens-header">
                <h2>📊 Token Bestände</h2>
                <button class="refresh-btn" onclick="loadWalletData()">🔄 Aktualisieren</button>
            </div>
            <div id="tokenContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Lade Token-Daten von der Apertum Blockchain...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@4.3.0/dist/web3.min.js"></script>
    <script>
        const walletAddress = '0xC7e112D6Db20A4A9213834B2Cb235c34733e6591';
        const rpcUrl = 'https://rpc.apertum.io/ext/bc/YDJ1r9RMkewATmA7B35q1bdV18aywzmdiXwd9zGBq3uQjsCnn/rpc';
        
        // Web3 initialisieren
        const web3 = new Web3(rpcUrl);

        // ERC-20 Token ABI (nur die Funktionen, die wir brauchen)
        const ERC20_ABI = [
            {
                "constant": true,
                "inputs": [],
                "name": "name",
                "outputs": [{"name": "", "type": "string"}],
                "type": "function"
            },
            {
                "constant": true,
                "inputs": [],
                "name": "symbol",
                "outputs": [{"name": "", "type": "string"}],
                "type": "function"
            },
            {
                "constant": true,
                "inputs": [],
                "name": "decimals",
                "outputs": [{"name": "", "type": "uint8"}],
                "type": "function"
            },
            {
                "constant": true,
                "inputs": [{"name": "_owner", "type": "address"}],
                "name": "balanceOf",
                "outputs": [{"name": "balance", "type": "uint256"}],
                "type": "function"
            }
        ];

        // Transfer Event Signature für ERC-20 Token
        const TRANSFER_EVENT_SIGNATURE = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';

        async function loadWalletData() {
            try {
                const content = document.getElementById('tokenContent');
                content.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Scanne Blockchain nach Token-Transaktionen...</p>
                        <p style="font-size: 12px; margin-top: 10px;">Dies kann einen Moment dauern...</p>
                    </div>
                `;

                // Native APTM Balance abrufen
                const nativeBalance = await web3.eth.getBalance(walletAddress);
                const aptmBalance = web3.utils.fromWei(nativeBalance, 'ether');
                document.getElementById('nativeBalance').textContent = `${parseFloat(aptmBalance).toFixed(4)} APTM`;

                // Token-Liste erstellen
                const tokens = [];
                
                // Native Token hinzufügen
                tokens.push({
                    name: 'Apertum',
                    symbol: 'APTM',
                    address: 'native',
                    balance: parseFloat(aptmBalance),
                    decimals: 18,
                    isNative: true
                });

                // Token automatisch finden durch Log-Scanning
                const foundTokens = await scanForTokens(walletAddress);
                
                // Token-Balances abrufen
                for (const tokenAddress of foundTokens) {
                    try {
                        const tokenContract = new web3.eth.Contract(ERC20_ABI, tokenAddress);
                        
                        // Token-Infos abrufen
                        const [name, symbol, decimals, balance] = await Promise.all([
                            tokenContract.methods.name().call().catch(() => 'Unknown Token'),
                            tokenContract.methods.symbol().call().catch(() => 'UNKNOWN'),
                            tokenContract.methods.decimals().call().catch(() => 18),
                            tokenContract.methods.balanceOf(walletAddress).call()
                        ]);

                        const tokenBalance = parseFloat(balance) / Math.pow(10, decimals);

                        if (tokenBalance > 0) {
                            tokens.push({
                                name: name,
                                symbol: symbol,
                                address: tokenAddress,
                                balance: tokenBalance,
                                decimals: decimals,
                                isNative: false
                            });
                        }
                    } catch (error) {
                        console.error(`Fehler bei Token ${tokenAddress}:`, error);
                    }
                }

                displayTokens(tokens);
                document.getElementById('tokenCount').textContent = tokens.length;

            } catch (error) {
                console.error('Fehler beim Laden der Daten:', error);
                displayError('Fehler beim Laden der Token-Daten. Bitte stelle sicher, dass der RPC-Endpunkt erreichbar ist.');
            }
        }

        async function scanForTokens(address) {
            const tokenAddresses = new Set();
            
            try {
                // Aktuellen Block holen
                const latestBlock = await web3.eth.getBlockNumber();
                const startBlock = Math.max(0, Number(latestBlock) - 50000); // Letzte ~50k Blocks scannen
                
                console.log(`Scanne Blocks ${startBlock} bis ${latestBlock}...`);
                
                // Logs für eingehende Transfers (an deine Wallet)
                const incomingLogs = await web3.eth.getPastLogs({
                    fromBlock: startBlock,
                    toBlock: 'latest',
                    topics: [
                        TRANSFER_EVENT_SIGNATURE,
                        null,
                        web3.utils.padLeft(address.toLowerCase(), 64)
                    ]
                });

                // Logs für ausgehende Transfers (von deiner Wallet)
                const outgoingLogs = await web3.eth.getPastLogs({
                    fromBlock: startBlock,
                    toBlock: 'latest',
                    topics: [
                        TRANSFER_EVENT_SIGNATURE,
                        web3.utils.padLeft(address.toLowerCase(), 64)
                    ]
                });

                // Token-Adressen sammeln
                [...incomingLogs, ...outgoingLogs].forEach(log => {
                    if (log.address) {
                        tokenAddresses.add(log.address);
                    }
                });

                console.log(`${tokenAddresses.size} Token-Contracts gefunden`);
                
            } catch (error) {
                console.error('Fehler beim Scannen der Logs:', error);
                // Fallback: Versuche kleineren Block-Range
                try {
                    const latestBlock = await web3.eth.getBlockNumber();
                    const startBlock = Math.max(0, Number(latestBlock) - 10000);
                    
                    const logs = await web3.eth.getPastLogs({
                        fromBlock: startBlock,
                        toBlock: 'latest',
                        topics: [
                            TRANSFER_EVENT_SIGNATURE,
                            null,
                            web3.utils.padLeft(address.toLowerCase(), 64)
                        ]
                    });

                    logs.forEach(log => {
                        if (log.address) {
                            tokenAddresses.add(log.address);
                        }
                    });
                } catch (fallbackError) {
                    console.error('Auch Fallback-Scan fehlgeschlagen:', fallbackError);
                }
            }
            
            return Array.from(tokenAddresses);
        }

        function displayTokens(tokens) {
            const content = document.getElementById('tokenContent');
            
            if (tokens.length === 0) {
                displayEmptyState();
                return;
            }

            const tokenListHTML = tokens.map(token => `
                <div class="token-item ${token.isNative ? 'native-token' : ''}">
                    <div class="token-info">
                        <div class="token-icon">
                            ${token.symbol.charAt(0)}
                        </div>
                        <div class="token-details">
                            <div class="token-name">${token.name}</div>
                            <div class="token-symbol">${token.symbol}</div>
                        </div>
                    </div>
                    <div class="token-balance">
                        <div class="balance-amount">${formatNumber(token.balance)} ${token.symbol}</div>
                        <div class="token-address">${token.isNative ? 'Native Token' : shortenAddress(token.address)}</div>
                    </div>
                </div>
            `).join('');

            content.innerHTML = `<div class="token-list">${tokenListHTML}</div>`;
        }

        function displayEmptyState() {
            const content = document.getElementById('tokenContent');
            content.innerHTML = `
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                    </svg>
                    <h3>Keine Token gefunden</h3>
                    <p>Diese Wallet hat aktuell keine Token auf Apertum.</p>
                    <button class="refresh-btn" onclick="loadWalletData()" style="margin-top: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;">Neu laden</button>
                </div>
            `;
            document.getElementById('tokenCount').textContent = '0';
        }

        function displayError(message) {
            const content = document.getElementById('tokenContent');
            content.innerHTML = `
                <div class="error">
                    <strong>⚠️ Fehler:</strong> ${message}
                    <br><br>
                    <button class="refresh-btn" onclick="loadWalletData()" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; cursor: pointer;">Erneut versuchen</button>
                </div>
            `;
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(2) + 'K';
            } else if (num < 0.01) {
                return num.toFixed(8);
            } else if (num < 1) {
                return num.toFixed(6);
            }
            return num.toFixed(4);
        }

        function shortenAddress(address) {
            return `${address.slice(0, 6)}...${address.slice(-4)}`;
        }

        // Beim Laden der Seite Daten abrufen
        loadWalletData();
    </script>
</body>
</html>
