<!-- ══════════════════════════════════════════════════════════════════════════
     ZUGANGS-SCHUTZ SNIPPET - KORRIGIERT
     NUR in kompakt-kap*.html einfügen, NICHT in index.html!
     Position: Direkt nach dem <body> Tag
     
     WICHTIG: Verwendet jetzt den richtigen Key 'lgf_access_granted'
     ══════════════════════════════════════════════════════════════════════════ -->

<script>
(function() {
  // Prüfe ob gültiger Zugang vorhanden (RICHTIGER KEY!)
  const hasAccess = localStorage.getItem('lgf_access_granted') === 'true';
  
  if (!hasAccess) {
    // Kein Zugang - überschreibe sofort den Body-Inhalt
    document.write(`
      <div style="
        position: fixed; inset: 0;
        background: linear-gradient(135deg, #2c1e0f 0%, #3d2d1e 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 40px 24px; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      ">
        <div style="font-size: 64px; margin-bottom: 24px;">🔒</div>
        <h1 style="
          font-size: clamp(24px, 6vw, 32px);
          font-weight: 700; color: #c4a265;
          margin-bottom: 16px; line-height: 1.2;
        ">Zugang verweigert</h1>
        <p style="
          font-size: 16px; color: #b89a76;
          line-height: 1.6; margin-bottom: 32px;
          max-width: 400px;
        ">
          Dieser Inhalt ist nur mit einem gültigen Zugangs-Code verfügbar.
        </p>
        <a href="https://app.letsgofree.me" style="
          display: inline-flex; align-items: center; gap: 10px;
          background: linear-gradient(135deg, #c4a265, #a0784a);
          color: #2c1e0f; text-decoration: none;
          font-size: 16px; font-weight: 600;
          padding: 14px 28px; border-radius: 12px;
          box-shadow: 0 4px 20px rgba(196,162,101,.35);
        ">
          <span>🔓</span> Zur App
        </a>
      </div>
    `);
    document.close();
  }
  // Wenn hasAccess true ist, passiert nichts - normaler Inhalt wird geladen
})();
</script>
