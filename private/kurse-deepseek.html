<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Token Kurse - Tabelle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
        }
        
        h1 {
            font-size: 2.2rem;
            color: #60a5fa;
            margin-bottom: 10px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .controls button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .controls button:hover {
            background: #2563eb;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #1e293b;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        thead {
            background: #0f172a;
            position: sticky;
            top: 0;
        }
        
        th {
            padding: 16px 12px;
            text-align: left;
            font-weight: 600;
            color: #94a3b8;
            border-bottom: 2px solid #334155;
            font-size: 0.9rem;
        }
        
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #334155;
        }
        
        tr:hover {
            background: rgba(30, 41, 59, 0.8);
        }
        
        .chain-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .chain-apertum {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        
        .chain-bsc {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }
        
        .chain-eth {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
        }
        
        .chain-polygon {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }
        
        .token-symbol {
            font-weight: 600;
            color: #e2e8f0;
        }
        
        .token-name {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .price {
            font-weight: 700;
            font-size: 1.1rem;
            font-variant-numeric: tabular-nums;
        }
        
        .price-up {
            color: #4ade80;
        }
        
        .price-down {
            color: #f87171;
        }
        
        .price-neutral {
            color: #94a3b8;
        }
        
        .change {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .change-up {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        
        .change-down {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        
        .status {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(100, 116, 139, 0.2);
            color: #94a3b8;
        }
        
        .status-loading {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        
        .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        
        .last-updated {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }
        
        .api-info {
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 10px;
        }
        
        .address {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #94a3b8;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            th, td {
                padding: 12px 8px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Live Token Kurse</h1>
            <div class="api-info">Echte Preise von CoinGecko API</div>
        </header>
        
        <div class="controls">
            <button id="refresh-all">
                <span id="refresh-text">Alle Preise aktualisieren</span>
            </button>
            <button id="refresh-known">Bekannte Token aktualisieren</button>
        </div>
        
        <div class="table-container">
            <table id="token-table">
                <thead>
                    <tr>
                        <th>Chain</th>
                        <th>Symbol</th>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Preis (USD)</th>
                        <th>24h Änderung</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Token werden hier eingefügt -->
                </tbody>
            </table>
        </div>
        
        <div class="last-updated" id="last-updated">
            <i class="far fa-clock"></i> <span id="update-time">Noch nicht aktualisiert</span>
        </div>
    </div>

    <script>
        // Token Daten aus deiner Liste
        const tokens = [
            // Apertum Tokens
            { chain: 'apertum', symbol: 'APTM', name: 'Apertum', address: 'native' },
            { chain: 'apertum', symbol: 'wAPTM', name: 'Wrapped APTM', address: '0x110ac02ba3384bc055c13a87766049a74517beda' },
            { chain: 'apertum', symbol: 'wUSDT', name: 'Wrapped USDT', address: '0x1487db421f6b58e77bfefc905fdc1ede5fb85c7f' },
            { chain: 'apertum', symbol: 'wUSDC', name: 'Wrapped USDC', address: '0xd979f41e12a69aa82f04866444ea91e8e8faefd9' },
            { chain: 'apertum', symbol: 'wBTC', name: 'Wrapped BTC', address: '0x75598b9f54df1472bb2bdc3b5dc791bdb109a52b' },
            { chain: 'apertum', symbol: 'wETH', name: 'Wrapped ETH', address: '0x01882c43aa0bee891b54857c15cc19a3df946f01' },
            { chain: 'apertum', symbol: 'wBNB', name: 'Wrapped BNB', address: '0xf3074054737b9e83d73c3c17a007939e12698d5c' },
            { chain: 'apertum', symbol: 'wAVAX', name: 'Wrapped AVAX', address: '0xf75dd43f59cba81329f2fa3d98d0c0908cffebb8' },
            { chain: 'apertum', symbol: 'wSOL', name: 'Wrapped SOL', address: '0xf081daa36f367f4a5f93ac68c14fb39b50a58ef8' },
            
            // BSC Tokens
            { chain: 'bsc', symbol: 'BNB', name: 'BNB', address: 'native' },
            { chain: 'bsc', symbol: 'USDT', name: 'Tether USD', address: '0x55d398326f99059ff775485246999027b3197955' },
            { chain: 'bsc', symbol: 'USDC', name: 'USD Coin', address: '0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d' },
            { chain: 'bsc', symbol: 'BTCB', name: 'BTCB Token', address: '0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c' },
            { chain: 'bsc', symbol: 'VOW', name: 'Vow Token', address: '0xF585B5b4f22816BAf7629AEA55B701662630397b' },
            { chain: 'bsc', symbol: 'v$', name: 'VOW Dollar USA', address: '0x9C23942Ca2C35e06d1d20747F33705983A18d2AB' },
            { chain: 'bsc', symbol: 'vUSD', name: 'vUSD Token', address: '0xc0D8DaA6516BaB4eFCe440860987E735BaB44160' },
            { chain: 'bsc', symbol: 'TLN', name: 'TLN Token', address: '0xf7d142a354322C7560250CaA0e2a06c89649e4C2' },
            { chain: 'bsc', symbol: 'TLN+', name: 'TLN+', address: '0x29280091Fa7F3ABe4739Ad5f1f7C5287feAf7736' },
            { chain: 'bsc', symbol: 'TLNx', name: 'TLNx', address: '0x3ddA9eA88136EceDe768CD374a2af37219da55e7' },
            { chain: 'bsc', symbol: 'TLNG', name: 'TLN Gold', address: '0xAa90a8CDAB8B8E902293a2817d1d286f66cBcec5' },
            
            // Ethereum Tokens
            { chain: 'eth', symbol: 'ETH', name: 'Ethereum', address: 'native' },
            { chain: 'eth', symbol: 'VOW', name: 'Vow Token', address: '0x1BBf25e71EC48B84d773809B4bA55B6F4bE946Fb' },
            { chain: 'eth', symbol: 'v$', name: 'VOW Dollar USA', address: '0xBa7fE208E0167e4047a996e1Efea830515F433F8' },
            { chain: 'eth', symbol: 'vUSD', name: 'vUSD Token', address: '0x0fc6C0465C9739d4a42dAca22eB3b2CB0Eb9937A' },
            
            // Polygon Tokens
            { chain: 'polygon', symbol: 'POL', name: 'Polygon', address: 'native' }
        ];
        
        // CoinGecko Mappings für bekannte Tokens
        const coinGeckoMappings = {
            // Native Tokens
            'ETH': 'ethereum',
            'BNB': 'binancecoin',
            'POL': 'matic-network',
            
            // Stablecoins
            'USDT': 'tether',
            'USDC': 'usd-coin',
            
            // Andere bekannte Tokens
            'BTCB': 'bitcoin',
            'wBTC': 'bitcoin',
            'wETH': 'ethereum',
            'wBNB': 'binancecoin',
            'wAVAX': 'avalanche-2',
            'wSOL': 'solana',
            'VOW': 'vow',
            'v$': 'vow-dollar-usa',
            'vUSD': 'vusd',
            'TLN': 'tln',
            'TLN+': 'tln-plus',
            'TLNx': 'tlnx',
            'TLNG': 'tln-gold'
        };
        
        // Token Preise Cache
        let tokenPrices = {};
        
        // DOM Elemente
        const tableBody = document.getElementById('table-body');
        const lastUpdatedEl = document.getElementById('update-time');
        const refreshAllBtn = document.getElementById('refresh-all');
        const refreshKnownBtn = document.getElementById('refresh-known');
        const refreshText = document.getElementById('refresh-text');
        
        // Formatierung
        function formatPrice(price) {
            if (!price || isNaN(price)) return '-';
            if (price < 0.0001) return '$' + price.toExponential(4);
            if (price < 1) return '$' + price.toFixed(6);
            if (price < 1000) return '$' + price.toFixed(4);
            return '$' + price.toLocaleString('de-DE', { 
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }
        
        function formatChange(change) {
            if (change === null || change === undefined) return '-';
            const symbol = change >= 0 ? '↗' : '↘';
            const colorClass = change >= 0 ? 'change-up' : 'change-down';
            return `<span class="change ${colorClass}">${symbol} ${Math.abs(change).toFixed(2)}%</span>`;
        }
        
        function formatTime() {
            return new Date().toLocaleTimeString('de-DE', {
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit'
            });
        }
        
        // CoinGecko API Abfrage für mehrere Tokens
        async function fetchCoinGeckoPrices(symbols) {
            // Filtere nur Tokens mit CoinGecko Mapping
            const validSymbols = symbols.filter(symbol => coinGeckoMappings[symbol]);
            if (validSymbols.length === 0) return {};
            
            // Erstelle IDs String für CoinGecko API
            const coinIds = validSymbols.map(symbol => coinGeckoMappings[symbol]).join(',');
            
            try {
                const response = await fetch(
                    `https://api.coingecko.com/api/v3/simple/price?ids=${coinIds}&vs_currencies=usd&include_24hr_change=true`,
                    { mode: 'cors' }
                );
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                const prices = {};
                
                // Mappe Daten zurück zu Symbols
                validSymbols.forEach(symbol => {
                    const coinId = coinGeckoMappings[symbol];
                    if (data[coinId]) {
                        prices[symbol] = {
                            price: data[coinId].usd,
                            change24h: data[coinId].usd_24h_change || 0
                        };
                    }
                });
                
                return prices;
            } catch (error) {
                console.error('CoinGecko API Fehler:', error);
                return {};
            }
        }
        
        // Suche Token auf CoinGecko (für unbekannte Tokens)
        async function searchTokenOnCoinGecko(tokenName) {
            try {
                const response = await fetch(
                    `https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(tokenName)}`,
                    { mode: 'cors' }
                );
                
                if (response.ok) {
                    const data = await response.json();
                    const coins = data.coins || [];
                    
                    if (coins.length > 0) {
                        // Nehme das erste Ergebnis
                        const coin = coins[0];
                        const priceResponse = await fetch(
                            `https://api.coingecko.com/api/v3/simple/price?ids=${coin.id}&vs_currencies=usd&include_24hr_change=true`,
                            { mode: 'cors' }
                        );
                        
                        if (priceResponse.ok) {
                            const priceData = await priceResponse.json();
                            if (priceData[coin.id]) {
                                return {
                                    price: priceData[coin.id].usd,
                                    change24h: priceData[coin.id].usd_24h_change || 0,
                                    source: 'CoinGecko (gefunden)'
                                };
                            }
                        }
                    }
                }
            } catch (error) {
                // Ignorieren
            }
            return null;
        }
        
        // Preise für alle Tokens abrufen
        async function fetchAllPrices() {
            console.log('Starte Preisabfrage für', tokens.length, 'Tokens');
            
            // 1. Bekannte Tokens von CoinGecko abrufen
            const symbols = tokens.map(t => t.symbol);
            const knownPrices = await fetchCoinGeckoPrices(symbols);
            
            // 2. Für unbekannte Tokens individuell suchen
            const unknownTokens = tokens.filter(t => !knownPrices[t.symbol] && !tokenPrices[t.symbol]?.price);
            const searchPromises = [];
            
            for (const token of unknownTokens) {
                searchPromises.push(
                    searchTokenOnCoinGecko(token.name).then(result => {
                        if (result) {
                            knownPrices[token.symbol] = result;
                        }
                    })
                );
            }
            
            await Promise.allSettled(searchPromises);
            
            // Cache aktualisieren
            Object.assign(tokenPrices, knownPrices);
            
            return tokenPrices;
        }
        
        // Tabelle aktualisieren
        function updateTable(prices) {
            tableBody.innerHTML = '';
            
            tokens.forEach(token => {
                const row = document.createElement('tr');
                const priceData = prices[token.symbol];
                
                // Chain Badge
                const chainClass = `chain-${token.chain}`;
                
                // Preis und Änderung
                let priceDisplay = '-';
                let changeDisplay = '-';
                let status = 'Nicht gefunden';
                let statusClass = 'status-error';
                
                if (priceData) {
                    priceDisplay = formatPrice(priceData.price);
                    changeDisplay = formatChange(priceData.change24h);
                    status = 'Live';
                    statusClass = 'status';
                } else if (tokenPrices[token.symbol]?.loading) {
                    status = 'Lädt...';
                    statusClass = 'status-loading';
                }
                
                row.innerHTML = `
                    <td><span class="chain-badge ${chainClass}">${token.chain}</span></td>
                    <td>
                        <div class="token-symbol">${token.symbol}</div>
                    </td>
                    <td>
                        <div class="token-name">${token.name}</div>
                    </td>
                    <td>
                        <div class="address" title="${token.address}">
                            ${token.address === 'native' ? 'Native Token' : token.address}
                        </div>
                    </td>
                    <td>
                        <div class="price ${priceData ? (priceData.change24h >= 0 ? 'price-up' : 'price-down') : 'price-neutral'}">
                            ${priceDisplay}
                        </div>
                    </td>
                    <td>${changeDisplay}</td>
                    <td><span class="status ${statusClass}">${status}</span></td>
                `;
                
                tableBody.appendChild(row);
            });
        }
        
        // Alle Preise aktualisieren
        async function updateAllPrices() {
            refreshText.innerHTML = '<div class="loading"></div>Aktualisiere...';
            refreshAllBtn.disabled = true;
            refreshKnownBtn.disabled = true;
            
            // Lade-Status setzen
            tokens.forEach(token => {
                if (!tokenPrices[token.symbol]) {
                    tokenPrices[token.symbol] = { loading: true };
                }
            });
            updateTable(tokenPrices);
            
            try {
                const prices = await fetchAllPrices();
                updateTable(prices);
                lastUpdatedEl.textContent = formatTime();
                
                console.log('Preise aktualisiert:', Object.keys(prices).length, 'Tokens gefunden');
                
                // Erfolgsstatistik
                const foundCount = Object.values(prices).filter(p => p.price).length;
                const notFoundCount = tokens.length - foundCount;
                console.log(`Ergebnis: ${foundCount} gefunden, ${notFoundCount} nicht gefunden`);
                
            } catch (error) {
                console.error('Fehler beim Aktualisieren:', error);
                lastUpdatedEl.textContent = 'Fehler beim Aktualisieren';
            }
            
            refreshText.textContent = 'Alle Preise aktualisieren';
            refreshAllBtn.disabled = false;
            refreshKnownBtn.disabled = false;
        }
        
        // Nur bekannte Tokens aktualisieren
        async function updateKnownPrices() {
            refreshText.innerHTML = '<div class="loading"></div>Aktualisiere bekannte...';
            
            const knownSymbols = tokens
                .filter(t => coinGeckoMappings[t.symbol])
                .map(t => t.symbol);
            
            const knownPrices = await fetchCoinGeckoPrices(knownSymbols);
            Object.assign(tokenPrices, knownPrices);
            
            updateTable(tokenPrices);
            lastUpdatedEl.textContent = formatTime();
            refreshText.textContent = 'Alle Preise aktualisieren';
        }
        
        // Event Listener
        refreshAllBtn.addEventListener('click', updateAllPrices);
        refreshKnownBtn.addEventListener('click', updateKnownPrices);
        
        // Initiale Tabelle erstellen
        tokens.forEach(token => {
            tokenPrices[token.symbol] = { loading: true };
        });
        updateTable(tokenPrices);
        
        // Initiale Daten laden
        setTimeout(updateAllPrices, 1000);
        
        // Automatische Aktualisierung alle 60 Sekunden
        setInterval(updateAllPrices, 60000);
        
        // Debug Info
        console.log('Token Kurs Tabelle gestartet');
        console.log('Tokens:', tokens.length);
        console.log('Bekannte CoinGecko Mappings:', Object.keys(coinGeckoMappings).length);
        console.log('API: CoinGecko (CORS-freundlich)');
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
