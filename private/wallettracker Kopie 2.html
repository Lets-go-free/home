// Price cache with 5 minute expiry
const priceCache = new Map();
const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes

// CoinGecko API mapping (contract address to CoinGecko ID)
const COINGECKO_IDS = {
  // Add known token mappings here
  'ethereum': 'ethereum',
  'binancecoin': 'binancecoin',
  'matic-network': 'matic-network'
};

async function fetchTokenPrice(tokenAddress, chain){
  const cacheKey = `${chain}-${tokenAddress.toLowerCase()}`;
  const now = Date.now();
  
  // Check cache
  if(priceCache.has(cacheKey)){
    const cached = priceCache.get(cacheKey);
    if(now - cached.timestamp < CACHE_DURATION){
      return cached.data;
    }
  }
  
  try{
    // Try CoinGecko API
    let coinId = null;
    
    // Map chain + address to CoinGecko platform
    const platformMap = {
      'eth': 'ethereum',
      'bsc': 'binance-smart-chain',
      'polygon': 'polygon-pos',
      'apertum': null // Not supported by CoinGecko
    };
    
    const platform = platformMap[chain];
    if(!platform) return null;
    
    // For native tokens
    if(tokenAddress === 'native'){
      const nativeIds = {
        'eth': 'ethereum',
        'bsc': 'binancecoin',
        'polygon': 'matic-network'
      };
      coinId = nativeIds[chain];
    }
    
    if(coinId){
      const url = `https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd&include_24hr_change=true`;
      const response = await fetch(url);
      const data = await response.json();
      
      if(data[coinId]){
        const priceData = {
          price: data[coinId].usd,
          change24h: data[coinId].usd_24h_change || 0,
          timestamp: now
        };
        priceCache.set(cacheKey, { data: priceData, timestamp: now });
        return priceData;
      }
    }else{
      // Try by contract address
      const url = `https://api.coingecko.com/api/v3/simple/token_price/${platform}?contract_addresses=${tokenAddress}&vs_currencies=usd&include_24hr_change=true`;
      const response = await fetch(url);
      const data = await response.json();
      
      const key = tokenAddress.toLowerCase();
      if(data[key]){
        const priceData = {
          price: data[key].usd,
          change24h: data[key].usd_24h_change || 0,
          timestamp: now
        };
        priceCache.set(cacheKey, { data: priceData, timestamp: now });
        return priceData;
      }
    }
  }catch(e){
    console.error(`Price fetch error for ${tokenAddress}:`, e);
  }
  
  return null;
}

function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

// Explorer API method (Apertum & ETH)
async function getTokenBalancesFromExplorer(chain, address, walletName){
  const results = [];
  
  try{
    // Native balance
    const nativeBalance = await getNativeBalanceFromExplorer(chain, address);
    if(nativeBalance > 0){
      const nativeTokens = {
        apertum: {symbol: 'APTM', name: 'APTM'},
        eth: {symbol: 'ETH', name: 'ETH'}
      };
      const token = nativeTokens[chain];
      results.push({
        wallet: walletName,
        walletAddress: address,
        tokenSymbol: token.symbol,
        tokenName: token.name,
        chain: chain,
        balance: nativeBalance,
        tokenAddress: 'native',
        decimals: 18,
        priceUsd: null,
        valueUsd: null
      });
    }
    
    // ERC20 tokens
    const chainTokens = tokens[chain] || [];
    for(const sheetToken of chainTokens){
      if(sheetToken.address === 'native') continue;
      
      try{
        const balance = await getTokenBalanceFromExplorer(chain, address, sheetToken.address);
        if(balance > 0){
          const decimals = sheetToken.decimals || 18;
          results.push({
            wallet: walletName,
            walletAddress: address,
            tokenSymbol: sheetToken.symbol,
            tokenName: sheetToken.name,
            chain: chain,
            balance: balance / Math.pow(10, decimals),
            tokenAddress: sheetToken.address,
            decimals: decimals,
            priceUsd: null,
            valueUsd: null
          });
        }
        await delay(200);
      }catch(e){
        console.error(`    ✗ ${sheetToken.symbol}:`, e.message);
      }
    }
    
  }catch(e){
    console.error(`Error loading ${chain}:`, e);
  }
  
  return results;
}

async function getNativeBalanceFromExplorer(chain, address){
  const apiUrl = EXPLORER_APIS[chain];
  let url;
  
  if(chain === 'apertum'){
    url = `${apiUrl}?module=account&action=balance&address=${address}`;
  }else{
    url = `${apiUrl}?chainid=${ETH_CHAIN_ID}&module=account&action=balance&address=${address}&tag=latest&apikey=${API_KEY}`;
  }
  
  const response = await fetch(url);
  const data = await response.json();
  
  if(data.status === '1' && data.result){
    return parseFloat(data.result) / 1e18;
  }
  
  return 0;
}

async function getTokenBalanceFromExplorer(chain, walletAddr, tokenAddr){
  const apiUrl = EXPLORER_APIS[chain];
  let url;
  
  if(chain === 'apertum'){
    url = `${apiUrl}?module=account&action=tokenbalance&contractaddress=${tokenAddr}&address=${walletAddr}`;
  }else{
    url = `${apiUrl}?chainid=${ETH_CHAIN_ID}&module=account&action=tokenbalance&contractaddress=${tokenAddr}&address=${walletAddr}&tag=latest&apikey=${API_KEY}`;
  }
  
  const response = await fetch(url);
  const data = await response.json();
  
  if(data.status === '1' && data.result){
    return parseFloat(data.result);
  }
  
  return 0;
}

// Web3 method (BSC & Polygon)
async function getTokenBalancesFromWeb3(chain, address, walletName){
  const results = [];
  const w3 = web3Instances[chain];
  
  try{
    // Native balance
    const nativeBalance = await w3.eth.getBalance(address);
    const nativeBal = parseFloat(w3.utils.fromWei(nativeBalance, 'ether'));
    
    if(nativeBal > 0){
      const nativeTokens = {
        bsc: {symbol: 'BNB', name: 'BNB'},
        polygon: {symbol: 'POL', name: 'POL'}
      };
      const token = nativeTokens[chain];
      results.push({
        wallet: walletName,
        walletAddress: address,
        tokenSymbol: token.symbol,
        tokenName: token.name,
        chain: chain,
        balance: nativeBal,
        tokenAddress: 'native',
        decimals: 18,
        priceUsd: null,
        valueUsd: null
      });
    }
    
    // ERC20 tokens
    const chainTokens = tokens[chain] || [];
    for(const sheetToken of chainTokens){
      if(sheetToken.address === 'native') continue;
      
      try{
        const contract = new w3.eth.Contract(ERC20_ABI, sheetToken.address);
        let decimals = sheetToken.decimals;
        
        if(!decimals){
          decimals = parseInt(await contract.methods.decimals().call());
        }
        
        const rawBalance = await contract.methods.balanceOf(address).call();
        const balance = parseFloat(rawBalance) / Math.pow(10, decimals);
        
        if(balance > 0){
          results.push({
            wallet: walletName,
            walletAddress: address,
            tokenSymbol: sheetToken.symbol,
            tokenName: sheetToken.name,
            chain: chain,
            balance: balance,
            tokenAddress: sheetToken.address,
            decimals: decimals,
            priceUsd: null,
            valueUsd: null
          });
        }
        
        await delay(500); // Longer delay for RPC
      }catch(e){
        console.error(`    ✗ ${sheetToken.symbol}:`, e.message);
      }
    }
    
  }catch(e){
    console.error(`Error loading ${chain}:`, e);
  }
  
  return results;
}

// Load prices for all unique tokens
async function loadPrices(){
  const uniqueTokens = new Map();
  
  // Get unique tokens
  allBalances.forEach(item => {
    const key = `${item.chain}-${item.tokenAddress}`;
    if(!uniqueTokens.has(key)){
      uniqueTokens.set(key, {
        symbol: item.tokenSymbol,
        name: item.tokenName,
        chain: item.chain,
        address: item.tokenAddress
      });
    }
  });
  
  console.log(`💰 Lade Preise für ${uniqueTokens.size} einzigartige Tokens...`);
  
  // Fetch prices with delay to avoid rate limits
  let count = 0;
  for(const [key, token] of uniqueTokens){
    try{
      const priceData = await fetchTokenPrice(token.address, token.chain);
      if(priceData){
        // Update all balances with this token
        allBalances.forEach(item => {
          if(item.chain === token.chain && item.tokenAddress === token.address){
            item.priceUsd = priceData.price;
            item.change24h = priceData.change24h;
            if(item.balance && item.priceUsd){
              item.valueUsd = item.balance * item.priceUsd;
            }
          }
        });
        count++;
      }
      await delay(1000); // 1 second delay between price requests
    }catch(e){
      console.error(`Price error for ${token.symbol}:`, e);
    }
  }
  
  console.log(`✓ ${count} Preise geladen`);
}

// Display price overview table
function displayPriceOverview(){
  const uniqueTokens = new Map();
  
  // Get unique tokens with prices
  allBalances.forEach(item => {
    if(item.priceUsd){
      const key = `${item.chain}-${item.tokenSymbol}`;
      if(!uniqueTokens.has(key)){
        uniqueTokens.set(key, {
          symbol: item.tokenSymbol,
          name: item.tokenName,
          chain: item.chain,
          price: item.priceUsd,
          change24h: item.change24h || 0
        });
      }
    }
  });
  
  if(uniqueTokens.size === 0){
    document.getElementById('priceOverview').style.display = 'none';
    return;
  }
  
  // Sort by chain then symbol
  const sorted = Array.from(uniqueTokens.values()).sort((a,b) => {
    if(a.chain !== b.chain) return a.chain.localeCompare(b.chain);
    return a.symbol.localeCompare(b.symbol);
  });
  
  const tbody = document.getElementById('priceTableBody');
  tbody.innerHTML = sorted.map(token => {
    const changeClass = token.change24h > 0 ? 'price-positive' : token.change24h < 0 ? 'price-negative' : 'price-neutral';
    const changeSign = token.change24h > 0 ? '+' : '';
    const now = new Date().toLocaleTimeString('de-CH');
    
    return `
      <tr>
        <td>
          <div class="token-info">
            <div class="token-icon">${token.symbol.charAt(0)}</div>
            <div class="token-details">
              <div class="token-symbol">${token.symbol}</div>
            </div>
          </div>
        </td>
        <td><span class="token-chain">${token.chain.toUpperCase()}</span></td>
        <td class="balance">$${formatNumber(token.price)}</td>
        <td class="${changeClass}">${changeSign}${token.change24h.toFixed(2)}%</td>
        <td class="last-updated">${now}</td>
      </tr>
    `;
  }).join('');
  
  document.getElementById('priceOverview').style.display = 'block';
}

// Display functions
function displayTable(){
const c=document.getElementById('tableContent');
if(allBalances.length===0){c.innerHTML='<div class="empty-state"><p>Keine Token mit Balance gefunden.</p></div>';return;}
const h='<div class="table-wrapper"><table><thead><tr><th>Wallet</th><th>Token</th><th>Token-Adresse</th><th>Anzahl</th></tr></thead><tbody id="tableBody">'+generateTableRows()+'</tbody></table></div>';
c.innerHTML=h;
populateFilters();
}

function generateTableRows(){
const gb=document.getElementById('groupByFilter')?.value||'none';
if(gb==='none'){
return allBalances.map((it,i)=>`<tr data-index="${i}"><td>${it.wallet}</td><td><div class="token-info"><div class="token-icon">${it.tokenSymbol.charAt(0)}</div><div class="token-details"><div class="token-symbol">${it.tokenSymbol}</div><div class="token-chain">${it.chain}</div></div></div></td><td class="token-address-cell" title="${it.tokenAddress}">${it.tokenAddress==='native'?'Native':it.tokenAddress}</td><td class="balance">${formatNumber(it.balance)}</td></tr>`).join('');
}else{
const g={};
allBalances.forEach((it,i)=>{const k=it[gb]||'Unbekannt';if(!g[k])g[k]=[];g[k].push({...it,originalIndex:i});});
let h='';
Object.keys(g).sort().forEach(k=>{
const its=g[k];
h+=`<tr class="group-header"><td colspan="4"><strong>${getGroupLabel(gb)}:</strong> ${k.toUpperCase()}</td></tr>`;
its.forEach(it=>{h+=`<tr data-index="${it.originalIndex}"><td>${it.wallet}</td><td><div class="token-info"><div class="token-icon">${it.tokenSymbol.charAt(0)}</div><div class="token-details"><div class="token-symbol">${it.tokenSymbol}</div><div class="token-chain">${it.chain}</div></div></div></td><td class="token-address-cell" title="${it.tokenAddress}">${it.tokenAddress==='native'?'Native':it.tokenAddress}</td><td class="balance">${formatNumber(it.balance)}</td></tr>`;});
});
return h;
}
}

function getGroupLabel(gb){const l={'wallet':'Wallet','chain':'Chain','tokenSymbol':'Token'};return l[gb]||gb;}

function populateFilters(){
const uw=[...new Set(allBalances.map(i=>i.wallet))].sort();
const wf=document.getElementById('walletFilter');
wf.innerHTML='<option value="">Alle Wallets</option>';
uw.forEach(w=>{wf.innerHTML+=`<option value="${w}">${w}</option>`;});
const uc=[...new Set(allBalances.map(i=>i.chain))].sort();
const cf=document.getElementById('chainFilter');
cf.innerHTML='<option value="">Alle Chains</option>';
uc.forEach(c=>{cf.innerHTML+=`<option value="${c}">${c.toUpperCase()}</option>`;});
const ut=[...new Set(allBalances.map(i=>i.tokenSymbol))].sort();
const tf=document.getElementById('tokenFilter');
tf.innerHTML='<option value="">Alle Token</option>';
ut.forEach(t=>{tf.innerHTML+=`<option value="${t}">${t}</option>`;});
}

function applyFilters(){
const wf=document.getElementById('walletFilter').value;
const cf=document.getElementById('chainFilter').value;
const tf=document.getElementById('tokenFilter').value;
const fb=allBalances.filter(i=>{const mw=!wf||i.wallet===wf;const mc=!cf||i.chain===cf;const mt=!tf||i.tokenSymbol===tf;return mw&&mc&&mt;});
const tmp=allBalances;
allBalances=fb;
const tbody=document.getElementById('tableBody');
if(tbody){tbody.parentElement.parentElement.innerHTML='<table><thead><tr><th>Wallet</th><th>Token</th><th>Token-Adresse</th><th>Anzahl</th></tr></thead><tbody id="tableBody">'+generateTableRows()+'</tbody></table>';}
allBalances=tmp;
updateStatsFiltered(fb);
}

function updateStats(){
document.getElementById('walletCount').textContent=wallets.length;
document.getElementById('tokenCount').textContent=allBalances.length;
document.getElementById('chainCount').textContent=Object.keys(tokens).length;
const tv=allBalances.reduce((s,i)=>s+(i.valueUsd||0),0);
document.getElementById('portfolioValue').textContent=tv>0?'$'+formatNumber(tv):'-';
}

function updateStatsFiltered(fb){
const uw=new Set(fb.map(i=>i.wallet));
document.getElementById('walletCount').textContent=uw.size;
document.getElementById('tokenCount').textContent=fb.length;
const uc=new Set(fb.map(i=>i.chain));
document.getElementById('chainCount').textContent=uc.size;
const tv=fb.reduce((s,i)=>s+(i.valueUsd||0),0);
document.getElementById('portfolioValue').textContent=tv>0?'$'+formatNumber(tv):'-';
}

function formatNumber(n){
if(n===null||n===undefined)return'-';
let d;
if(n>=1000)d=2;
else if(n>=1)d=4;
else if(n>=0.01)d=6;
else d=8;
const f=n.toFixed(d);
const p=f.split('.');
const ip=p[0];
const dp=p[1];
const fi=ip.replace(/\B(?=(\d{3})+(?!\d))/g,"'");
return dp?`${fi}.${dp}`:fi;
}

function displayError(m){const c=document.getElementById('tableContent');c.innerHTML=`<div class="error">${m}</div>`;}

// Event Listeners
document.getElementById('walletFilter').addEventListener('change',applyFilters);
document.getElementById('chainFilter').addEventListener('change',applyFilters);
document.getElementById('tokenFilter').addEventListener('change',applyFilters);
document.getElementById('groupByFilter').addEventListener('change',applyFilters);

// Timestamp
setInterval(()=>{document.getElementById('timestamp').textContent=new Date().toLocaleString('de-CH');},1000);
    </script>
</body>
