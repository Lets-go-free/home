<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wallet Token Tracker mit Preisen</title>
<script src="https://cdn.jsdelivr.net/npm/ethers/dist/ethers.min.js"></script>
<style>
body { font-family: sans-serif; padding: 20px; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
th { background: #f0f0f0; }
</style>
</head>
<body>

<h2>Wallet Token Tracker mit Preisen</h2>

<label>Chain: </label>
<select id="chain">
  <option value="bsc">BSC</option>
  <option value="eth">ETH</option>
  <option value="polygon">Polygon</option>
</select>
<button onclick="loadBalances()">Laden</button>

<table>
<thead>
<tr>
  <th>Wallet</th>
  <th>Token</th>
  <th>Symbol</th>
  <th>Balance</th>
  <th>Preis (USD)</th>
  <th>Wert (USD)</th>
</tr>
</thead>
<tbody id="result"></tbody>
</table>

<script>
// ==========================
// CONFIG
// ==========================
const wallets = [
  "0x59dc6669c1eb40df7b36be58812202a09c4491bf",
  "0x76882e6fc045391ba4f19d8a15ea4d8699ff7382"
];

const tokens = [
  {chain:'bsc', symbol:'BNB', name:'BNB', address:'native'},
  {chain:'bsc', symbol:'USDT', name:'Tether USD', address:'0x55d398326f99059ff775485246999027b3197955'},
  {chain:'eth', symbol:'ETH', name:'Ethereum', address:'native'},
  {chain:'eth', symbol:'VOW', name:'Vow Token', address:'0x1BBf25e71EC48B84d773809B4bA55B6F4bE946Fb'},
  {chain:'polygon', symbol:'POL', name:'Polygon', address:'native'},
  // ... du kannst hier deine volle Liste einfügen
];

// RPCs für Chains
const RPC = {
  bsc: "https://bsc-dataseed.binance.org/",
  eth: "https://mainnet.infura.io/v3/YOUR_INFURA_KEY", // optional Infura-Key
  polygon: "https://polygon-rpc.com/"
};

// ==========================
// MAIN
// ==========================
async function loadBalances() {
  const chain = document.getElementById("chain").value;
  const provider = new ethers.JsonRpcProvider(RPC[chain]);
  const resultEl = document.getElementById("result");
  resultEl.innerHTML = "";

  const chainTokens = tokens.filter(t => t.chain === chain);

  // Coingecko Token IDs mapping (nur die nativen für Demo)
  const coingeckoNative = { bsc:'binancecoin', eth:'ethereum', polygon:'matic-network' };

  for(const wallet of wallets) {
    for(const token of chainTokens){
      let balance = 0;
      if(token.address === 'native'){
        balance = await provider.getBalance(wallet);
        balance = Number(ethers.formatEther(balance));
      } else {
        const contract = new ethers.Contract(token.address, [
          "function balanceOf(address) view returns (uint256)",
          "function decimals() view returns (uint8)"
        ], provider);
        try {
          const [rawBal, decimals] = await Promise.all([contract.balanceOf(wallet), contract.decimals()]);
          balance = Number(rawBal)/Math.pow(10, decimals);
        } catch(e) {
          console.warn("Fehler bei", token.symbol, e);
          continue;
        }
      }

      // Preis abfragen über Coingecko (nur native Tokens Demo)
      let price = 0;
      try {
        if(token.address === 'native'){
          const resp = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coingeckoNative[chain]}&vs_currencies=usd`);
          const data = await resp.json();
          price = data[coingeckoNative[chain]].usd;
        }
      } catch(e){ price = 0; }

      const valueUSD = (balance*price).toFixed(2);

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${wallet}</td>
        <td>${token.name}</td>
        <td>${token.symbol}</td>
        <td>${balance}</td>
        <td>${price}</td>
        <td>${valueUSD}</td>
      `;
      resultEl.appendChild(tr);
      await new Promise(r => setTimeout(r, 200)); // friendly RPC pacing
    }
  }
}
</script>

</body>
</html>
