<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Chain Token Preise (USD)</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.6.0/dist/ethers.umd.min.js"></script>

<style>
* {
  box-sizing: border-box;
}
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #e5e7eb;
  padding: 20px;
  min-height: 100vh;
  margin: 0;
}
h1 {
  text-align: center;
  margin-bottom: 10px;
  font-size: 1.8rem;
}
.subtitle {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 30px;
  font-size: 0.9rem;
}
.chain-section {
  margin-bottom: 40px;
}
.chain-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 1px solid #334155;
}
.chain-header h2 {
  margin: 0;
  font-size: 1.3rem;
  color: #93c5fd;
}
.chain-badge {
  background: #334155;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  color: #94a3b8;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 15px;
}
.card {
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 16px;
  background: #020617;
  transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.token-info {
  display: flex;
  flex-direction: column;
}
.token-symbol {
  font-size: 1.1rem;
  font-weight: bold;
  color: #f1f5f9;
}
.token-name {
  font-size: 0.8rem;
  color: #64748b;
}
.token-type {
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: #1e3a5f;
  color: #60a5fa;
}
.token-type.native {
  background: #14532d;
  color: #4ade80;
}
.token-type.lp {
  background: #4c1d95;
  color: #a78bfa;
}
.price {
  font-size: 1.6rem;
  font-weight: bold;
  color: #22c55e;
  margin: 10px 0;
}
.price.loading {
  color: #94a3b8;
  font-size: 1rem;
}
.price.error {
  color: #ef4444;
  font-size: 0.9rem;
}
.price.na {
  color: #64748b;
  font-size: 0.9rem;
}
.address {
  font-size: 0.7rem;
  color: #475569;
  word-break: break-all;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #1e293b;
}
.source {
  font-size: 0.7rem;
  color: #64748b;
  margin-top: 4px;
}
.refresh-btn {
  display: block;
  margin: 0 auto 30px;
  padding: 12px 30px;
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  transition: background 0.2s;
}
.refresh-btn:hover {
  background: #2563eb;
}
.refresh-btn:disabled {
  background: #475569;
  cursor: not-allowed;
}
.status {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 20px;
  font-size: 0.85rem;
}
.last-update {
  text-align: center;
  color: #64748b;
  font-size: 0.8rem;
  margin-top: 30px;
}
</style>
</head>

<body>

<h1>🔗 Multi-Chain Token Preise</h1>
<p class="subtitle">Live On-Chain & API Preise in USD</p>

<button class="refresh-btn" onclick="refreshAll()">🔄 Alle Preise aktualisieren</button>
<p class="status" id="status">Initialisiere...</p>

<!-- BSC Section -->
<div class="chain-section">
  <div class="chain-header">
    <h2>🟡 BNB Smart Chain (BSC)</h2>
    <span class="chain-badge">Chain ID: 56</span>
  </div>
  <div class="grid" id="bsc-grid"></div>
</div>

<!-- Ethereum Section -->
<div class="chain-section">
  <div class="chain-header">
    <h2>🔷 Ethereum</h2>
    <span class="chain-badge">Chain ID: 1</span>
  </div>
  <div class="grid" id="eth-grid"></div>
</div>

<!-- Polygon Section -->
<div class="chain-section">
  <div class="chain-header">
    <h2>🟣 Polygon</h2>
    <span class="chain-badge">Chain ID: 137</span>
  </div>
  <div class="grid" id="polygon-grid"></div>
</div>

<!-- Apertum Section -->
<div class="chain-section">
  <div class="chain-header">
    <h2>🔵 Apertum</h2>
    <span class="chain-badge">Chain ID: 2786</span>
  </div>
  <div class="grid" id="apertum-grid"></div>
</div>

<p class="last-update" id="lastUpdate"></p>

<script>
// ========== CONFIGURATION ==========

const RPC_URLS = {
  bsc: "https://bsc-dataseed.binance.org/",
  eth: "https://eth.llamarpc.com",
  polygon: "https://polygon-rpc.com/",
  apertum: "https://rpc.apertum.io/ext/bc/YDJ1r9RMkewATmA7B35q1bdV18aywzmdiXwd9zGBq3uQjsCnn/rpc"
};

// Token definitions by chain
const TOKENS = {
  bsc: [
    { symbol: "BNB", name: "BNB", address: "native", type: "native", coingeckoId: "binancecoin" },
    { symbol: "USDT", name: "Tether USD", address: "0x55d398326f99059ff775485246999027b3197955", type: "token" },
    { symbol: "USDC", name: "USD Coin", address: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d", type: "token" },
    { symbol: "VOW", name: "Vow Token", address: "0xF585B5b4f22816BAf7629AEA55B701662630397b", type: "token", pool: "0xc6585bc17b53792f281a9739579dd60535c1f9fb" },
    { symbol: "v$", name: "VOW Dollar USA", address: "0x9C23942Ca2C35e06d1d20747F33705983A18d2AB", type: "token" },
    { symbol: "vUSD", name: "vUSD Token", address: "0xc0D8DaA6516BaB4eFCe440860987E735BaB44160", type: "token" },
    { symbol: "BTCB", name: "BTCB Token", address: "0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c", type: "token", coingeckoId: "binance-bitcoin" },
    { symbol: "TLN", name: "TLN Token", address: "0xf7d142a354322C7560250CaA0e2a06c89649e4C2", type: "token" },
    { symbol: "TLN+", name: "TLN+", address: "0x29280091Fa7F3ABe4739Ad5f1f7C5287feAf7736", type: "token" },
    { symbol: "TLNx", name: "TLNx", address: "0x3ddA9eA88136EceDe768CD374a2af37219da55e7", type: "token" },
    { symbol: "TLNG", name: "TLN Gold", address: "0xAa90a8CDAB8B8E902293a2817d1d286f66cBcec5", type: "token" },
    { symbol: "VOW/BTCB LP", name: "VOW / BTCB LP", address: "0x6B27bB584F44f55E865432dCeb9eBBE9A17fd4A8", type: "lp" },
    { symbol: "VOW/v$ LP", name: "Pancakeswap LP", address: "0xC51C99af9D5c31D0C37d028500b2b344DEbDf188", type: "lp" },
    { symbol: "TLN LP", name: "Pancakeswap LP (TLN 1+2)", address: "0x72dCf845AE36401e82e681B0E063d0703bAC0Bba", type: "lp" }
  ],
  eth: [
    { symbol: "ETH", name: "Ethereum", address: "native", type: "native", coingeckoId: "ethereum" },
    { symbol: "VOW", name: "Vow Token", address: "0x1BBf25e71EC48B84d773809B4bA55B6F4bE946Fb", type: "token", pool: "0x1E49768714E438E789047f48FD386686A5707DB2" },
    { symbol: "v$", name: "VOW Dollar USA", address: "0xBa7fE208E0167e4047a996e1Efea830515F433F8", type: "token", pool: "0xb9FF2FFF0a78D0087E9FDb12325dc30655Ac5A1A" },
    { symbol: "vUSD", name: "vUSD Token", address: "0x0fc6C0465C9739d4a42dAca22eB3b2CB0Eb9937A", type: "token" }
  ],
  polygon: [
    { symbol: "POL", name: "Polygon", address: "0x0000000000000000000000000000000000001010", type: "native", coingeckoId: "matic-network" }
  ],
  apertum: [
    { symbol: "APTM", name: "Apertum", address: "native", type: "native" },
    { symbol: "wAPTM", name: "Wrapped APTM", address: "0x110ac02ba3384bc055c13a87766049a74517beda", type: "token" },
    { symbol: "wUSDT", name: "Wrapped USDT", address: "0x1487db421f6b58e77bfefc905fdc1ede5fb85c7f", type: "token" },
    { symbol: "wUSDC", name: "Wrapped USDC", address: "0xd979f41e12a69aa82f04866444ea91e8e8faefd9", type: "token" },
    { symbol: "wBTC", name: "Wrapped BTC", address: "0x75598b9f54df1472bb2bdc3b5dc791bdb109a52b", type: "token" },
    { symbol: "wSOL", name: "Wrapped SOL", address: "0xf081daa36f367f4a5f93ac68c14fb39b50a58ef8", type: "token" },
    { symbol: "wETH", name: "Wrapped ETH", address: "0x01882c43aa0bee891b54857c15cc19a3df946f01", type: "token" },
    { symbol: "wBNB", name: "Wrapped BNB", address: "0xf3074054737b9e83d73c3c17a007939e12698d5c", type: "token" },
    { symbol: "wAVAX", name: "Wrapped AVAX", address: "0xf75dd43f59cba81329f2fa3d98d0c0908cffebb8", type: "token" }
  ]
};

// PancakeSwap V2 Pool addresses for price calculation
const BSC_POOLS = {
  VOW_USDT: "0xc6585bc17b53792f281a9739579dd60535c1f9fb",
  VOW_VDOLLAR: "0xc51c99af9d5c31d0c37d028500b2b344debdf188"
};

// Uniswap V2 Pool addresses for ETH price calculation
const ETH_POOLS = {
  VOW_WETH: "0x1e49768714e438e789047f48fd386686a5707db2",
  VDOLLAR_WETH: "0xb9ff2fff0a78d0087e9fdb12325dc30655ac5a1a"
};

// ABIs
const PAIR_ABI = [
  "function getReserves() view returns (uint112,uint112,uint32)",
  "function token0() view returns (address)",
  "function token1() view returns (address)",
  "function totalSupply() view returns (uint256)"
];

const ERC20_ABI = [
  "function decimals() view returns (uint8)",
  "function symbol() view returns (string)",
  "function balanceOf(address) view returns (uint256)"
];

// Global state
let providers = {};
let nativePrices = {};

// ========== HELPER FUNCTIONS ==========

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function updateLastUpdate() {
  const now = new Date();
  document.getElementById('lastUpdate').textContent = 
    `Letzte Aktualisierung: ${now.toLocaleString('de-CH')}`;
}

function formatPrice(price, decimals = 6) {
  if (price === null || price === undefined) return null;
  if (price < 0.000001) return '$' + price.toExponential(2);
  if (price < 0.01) return '$' + price.toFixed(8);
  if (price < 1) return '$' + price.toFixed(6);
  if (price < 100) return '$' + price.toFixed(4);
  return '$' + price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function shortenAddress(addr) {
  if (!addr || addr === 'native') return '';
  return addr.slice(0, 6) + '...' + addr.slice(-4);
}

// ========== PRICE FUNCTIONS ==========

async function fetchNativePrices() {
  try {
    const ids = 'binancecoin,ethereum,matic-network,bitcoin,solana,avalanche-2';
    const response = await fetch(
      `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`
    );
    const data = await response.json();
    
    nativePrices = {
      bnb: data.binancecoin?.usd || 0,
      eth: data.ethereum?.usd || 0,
      pol: data['matic-network']?.usd || 0,
      btc: data.bitcoin?.usd || 0,
      sol: data.solana?.usd || 0,
      avax: data['avalanche-2']?.usd || 0
    };
    
    return nativePrices;
  } catch (err) {
    console.error('CoinGecko API Error:', err);
    return {};
  }
}

async function getPriceFromPool(provider, poolAddress, baseToken, quoteDecimals = 18, baseDecimals = 18) {
  try {
    const pair = new ethers.Contract(poolAddress, PAIR_ABI, provider);
    const [token0, token1, reserves] = await Promise.all([
      pair.token0(),
      pair.token1(),
      pair.getReserves()
    ]);

    const r0 = Number(ethers.formatUnits(reserves[0], baseDecimals));
    const r1 = Number(ethers.formatUnits(reserves[1], quoteDecimals));

    if (token0.toLowerCase() === baseToken.toLowerCase()) {
      return r1 / r0;
    }
    if (token1.toLowerCase() === baseToken.toLowerCase()) {
      return r0 / r1;
    }
    return null;
  } catch (err) {
    console.error('Pool price error:', err);
    return null;
  }
}

// Verbesserte Funktion die Decimals dynamisch abfragt
async function getPriceFromPoolWithDecimals(provider, poolAddress, baseToken) {
  try {
    const pair = new ethers.Contract(poolAddress, PAIR_ABI, provider);
    const [token0Addr, token1Addr, reserves] = await Promise.all([
      pair.token0(),
      pair.token1(),
      pair.getReserves()
    ]);

    // Get decimals for both tokens
    const token0Contract = new ethers.Contract(token0Addr, ERC20_ABI, provider);
    const token1Contract = new ethers.Contract(token1Addr, ERC20_ABI, provider);
    
    const [decimals0, decimals1] = await Promise.all([
      token0Contract.decimals(),
      token1Contract.decimals()
    ]);

    const r0 = Number(ethers.formatUnits(reserves[0], decimals0));
    const r1 = Number(ethers.formatUnits(reserves[1], decimals1));

    console.log(`Pool ${poolAddress}:`);
    console.log(`  Token0: ${token0Addr} (${decimals0} decimals) - Reserve: ${r0}`);
    console.log(`  Token1: ${token1Addr} (${decimals1} decimals) - Reserve: ${r1}`);

    // baseToken ist der Token dessen Preis wir wollen
    // Preis = andere Reserve / base Reserve
    if (token0Addr.toLowerCase() === baseToken.toLowerCase()) {
      // baseToken ist token0, Preis in token1
      const price = r1 / r0;
      console.log(`  Price of token0 in token1: ${price}`);
      return price;
    }
    if (token1Addr.toLowerCase() === baseToken.toLowerCase()) {
      // baseToken ist token1, Preis in token0
      const price = r0 / r1;
      console.log(`  Price of token1 in token0: ${price}`);
      return price;
    }
    return null;
  } catch (err) {
    console.error('Pool price error:', poolAddress, err);
    return null;
  }
}

async function calculateBscPrices() {
  const prices = {};
  const provider = providers.bsc;
  
  // Native BNB from CoinGecko
  prices['BNB'] = nativePrices.bnb;
  
  // Stablecoins = $1
  prices['USDT'] = 1;
  prices['USDC'] = 1;
  
  // BTCB from CoinGecko
  prices['BTCB'] = nativePrices.btc;
  
  try {
    // VOW price from VOW/USDT pool
    const vowAddress = "0xf585b5b4f22816baf7629aea55b701662630397b";
    const vowPrice = await getPriceFromPool(provider, BSC_POOLS.VOW_USDT, vowAddress);
    if (vowPrice) {
      prices['VOW'] = vowPrice;
      
      // v$ price from VOW/v$ pool
      const vDollarAddress = "0x9C23942Ca2C35e06d1d20747F33705983A18d2AB";
      const vDollarInVow = await getPriceFromPool(provider, BSC_POOLS.VOW_VDOLLAR, vDollarAddress);
      if (vDollarInVow) {
        prices['v$'] = vDollarInVow * vowPrice;
      }
    }
  } catch (err) {
    console.error('BSC price calculation error:', err);
  }
  
  return prices;
}

async function calculateEthPrices() {
  const prices = {};
  const provider = providers.eth;
  
  // Native ETH from CoinGecko
  prices['ETH'] = nativePrices.eth;
  
  if (!provider || !nativePrices.eth) return prices;
  
  try {
    // VOW price from VOW/WETH Uniswap pool
    // VOW ist gepaart mit WETH, wir wollen den VOW Preis in ETH
    const vowAddress = "0x1BBf25e71EC48B84d773809B4bA55B6F4bE946Fb".toLowerCase();
    const vowInEth = await getPriceFromPoolWithDecimals(provider, ETH_POOLS.VOW_WETH, vowAddress);
    if (vowInEth) {
      prices['VOW'] = vowInEth * nativePrices.eth;
      console.log(`ETH VOW Price: ${vowInEth} ETH = $${prices['VOW']}`);
    }
    
    // v$ price from v$/WETH Uniswap pool
    const vDollarAddress = "0xBa7fE208E0167e4047a996e1Efea830515F433F8".toLowerCase();
    const vDollarInEth = await getPriceFromPoolWithDecimals(provider, ETH_POOLS.VDOLLAR_WETH, vDollarAddress);
    if (vDollarInEth) {
      prices['v$'] = vDollarInEth * nativePrices.eth;
      console.log(`ETH v$ Price: ${vDollarInEth} ETH = $${prices['v$']}`);
    }
  } catch (err) {
    console.error('ETH price calculation error:', err);
  }
  
  return prices;
}

// ========== RENDER FUNCTIONS ==========

function createCard(token, price, source) {
  const card = document.createElement('div');
  card.className = 'card';
  
  let priceClass = 'price';
  let priceText = '';
  
  if (price === 'loading') {
    priceClass += ' loading';
    priceText = 'Lädt...';
  } else if (price === 'error') {
    priceClass += ' error';
    priceText = 'Fehler';
  } else if (price === null || price === undefined) {
    priceClass += ' na';
    priceText = 'Kein Preis verfügbar';
  } else {
    priceText = formatPrice(price);
  }
  
  let typeClass = 'token-type';
  if (token.type === 'native') typeClass += ' native';
  if (token.type === 'lp') typeClass += ' lp';
  
  card.innerHTML = `
    <div class="card-header">
      <div class="token-info">
        <span class="token-symbol">${token.symbol}</span>
        <span class="token-name">${token.name}</span>
      </div>
      <span class="${typeClass}">${token.type.toUpperCase()}</span>
    </div>
    <div class="${priceClass}" id="price-${token.symbol.replace(/[^a-zA-Z0-9]/g, '')}-${token.address.slice(-6)}">${priceText}</div>
    ${source ? `<div class="source">Quelle: ${source}</div>` : ''}
    ${token.address !== 'native' ? `<div class="address">${token.address}</div>` : ''}
  `;
  
  return card;
}

function renderChain(chainId, tokens, prices = {}) {
  const grid = document.getElementById(`${chainId}-grid`);
  grid.innerHTML = '';
  
  tokens.forEach(token => {
    let price = prices[token.symbol];
    let source = '';
    
    if (token.coingeckoId) {
      source = 'CoinGecko API';
    } else if (token.pool) {
      source = 'PancakeSwap Pool';
    } else if (token.type === 'lp') {
      source = 'LP Token';
    } else if (chainId === 'apertum') {
      source = 'Kein DEX verfügbar';
    } else if (token.symbol === 'USDT' || token.symbol === 'USDC') {
      source = 'Stablecoin';
    }
    
    const card = createCard(token, price !== undefined ? price : 'loading', source);
    grid.appendChild(card);
  });
}

// ========== MAIN FUNCTIONS ==========

async function initProviders() {
  setStatus('Verbinde mit Blockchains...');
  
  for (const [chain, url] of Object.entries(RPC_URLS)) {
    try {
      providers[chain] = new ethers.JsonRpcProvider(url);
      // Test connection
      await providers[chain].getBlockNumber();
      console.log(`✅ ${chain} connected`);
    } catch (err) {
      console.error(`❌ ${chain} connection failed:`, err);
      providers[chain] = null;
    }
  }
}

async function refreshAll() {
  const btn = document.querySelector('.refresh-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Aktualisiere...';
  
  try {
    // Initialize with loading state
    Object.keys(TOKENS).forEach(chain => {
      renderChain(chain, TOKENS[chain], {});
    });
    
    setStatus('Lade Marktpreise von CoinGecko...');
    await fetchNativePrices();
    
    // BSC prices
    setStatus('Berechne BSC Preise...');
    const bscPrices = await calculateBscPrices();
    renderChain('bsc', TOKENS.bsc, bscPrices);
    
    // ETH prices
    setStatus('Berechne ETH Preise aus Uniswap...');
    const ethPrices = await calculateEthPrices();
    renderChain('eth', TOKENS.eth, ethPrices);
    
    // Polygon prices
    setStatus('Lade Polygon Preise...');
    const polygonPrices = {
      'POL': nativePrices.pol
    };
    renderChain('polygon', TOKENS.polygon, polygonPrices);
    
    // Apertum - no known DEX
    setStatus('Lade Apertum Token...');
    const apertumPrices = {
      // Wrapped tokens - prices based on underlying
      'wUSDT': 1,
      'wUSDC': 1,
      'wBTC': nativePrices.btc,
      'wETH': nativePrices.eth,
      'wBNB': nativePrices.bnb,
      'wSOL': nativePrices.sol,
      'wAVAX': nativePrices.avax
      // APTM and wAPTM - no price source available
    };
    renderChain('apertum', TOKENS.apertum, apertumPrices);
    
    setStatus('✅ Alle Preise aktualisiert');
    updateLastUpdate();
    
  } catch (err) {
    console.error('Refresh error:', err);
    setStatus('❌ Fehler beim Aktualisieren: ' + err.message);
  }
  
  btn.disabled = false;
  btn.textContent = '🔄 Alle Preise aktualisieren';
}

// ========== INIT ==========

(async () => {
  await initProviders();
  await refreshAll();
  
  // Auto-refresh every 60 seconds
  setInterval(refreshAll, 60000);
})();
</script>

</body>
</html>
