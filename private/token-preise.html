<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Preise – Multi-Chain</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.6.0/dist/ethers.umd.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #e5e7eb;
  padding: 20px;
  min-height: 100vh;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
  font-size: 2.5rem;
  background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 40px;
  font-size: 1.1rem;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.stat-card {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(148, 163, 184, 0.1);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}

.stat-label {
  font-size: 0.9rem;
  color: #94a3b8;
  margin-bottom: 8px;
}

.stat-value {
  font-size: 2rem;
  font-weight: 700;
  color: #22c55e;
}

.chain-section {
  margin-bottom: 50px;
}

.chain-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding: 15px 20px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  border-left: 4px solid #22c55e;
}

.chain-name {
  font-size: 1.5rem;
  font-weight: 600;
}

.chain-count {
  font-size: 0.9rem;
  color: #94a3b8;
  margin-left: auto;
}

.token-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.token-card {
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(148, 163, 184, 0.1);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.3s;
}

.token-card:hover {
  transform: translateY(-4px);
  border-color: rgba(34, 197, 94, 0.3);
  box-shadow: 0 8px 24px rgba(34, 197, 94, 0.15);
}

.token-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.token-symbol {
  font-size: 1.3rem;
  font-weight: 700;
  color: #93c5fd;
}

.token-badge {
  font-size: 0.7rem;
  padding: 4px 8px;
  border-radius: 4px;
  background: rgba(34, 197, 94, 0.1);
  color: #22c55e;
  font-weight: 600;
}

.token-name {
  font-size: 0.85rem;
  color: #64748b;
  margin-bottom: 12px;
}

.token-price {
  font-size: 2.2rem;
  font-weight: 700;
  color: #22c55e;
  margin: 12px 0;
}

.token-price.loading {
  color: #fbbf24;
  font-size: 1rem;
}

.token-price.error {
  color: #ef4444;
  font-size: 1rem;
}

.token-address {
  font-size: 0.75rem;
  color: #475569;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 8px;
}

.token-source {
  font-size: 0.7rem;
  color: #64748b;
  margin-top: 8px;
  font-style: italic;
}

.timestamp {
  text-align: center;
  color: #64748b;
  font-size: 0.9rem;
  margin-top: 40px;
  padding: 20px;
}

.loading-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(251, 191, 36, 0.3);
  border-top-color: #fbbf24;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">
  <h1>🔗 Multi-Chain Token Preise</h1>
  <div class="subtitle">Live On-Chain Daten von PancakeSwap, CoinGecko & DexScreener</div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Geladene Tokens</div>
      <div class="stat-value" id="tokenCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Chains</div>
      <div class="stat-value" id="chainCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Preise gefunden</div>
      <div class="stat-value" id="priceCount">0</div>
    </div>
  </div>

  <div id="tokenContainer"></div>

  <div class="timestamp" id="timestamp"></div>
</div>

<script>
// Token-Konfiguration
const TOKENS = [
  // Apertum
  { chain: 'apertum', symbol: 'APTM', name: 'Apertum', address: 'native' },
  { chain: 'apertum', symbol: 'wAPTM', name: 'Wrapped APTM', address: '0x110ac02ba3384bc055c13a87766049a74517beda' },
  { chain: 'apertum', symbol: 'wUSDT', name: 'Wrapped USDT', address: '0x1487db421f6b58e77bfefc905fdc1ede5fb85c7f' },
  { chain: 'apertum', symbol: 'wUSDC', name: 'Wrapped USDC', address: '0xd979f41e12a69aa82f04866444ea91e8e8faefd9' },
  { chain: 'apertum', symbol: 'wBTC', name: 'Wrapped BTC', address: '0x75598b9f54df1472bb2bdc3b5dc791bdb109a52b' },
  { chain: 'apertum', symbol: 'wSOL', name: 'Wrapped SOL', address: '0xf081daa36f367f4a5f93ac68c14fb39b50a58ef8' },
  { chain: 'apertum', symbol: 'wETH', name: 'Wrapped ETH', address: '0x01882c43aa0bee891b54857c15cc19a3df946f01' },
  { chain: 'apertum', symbol: 'wBNB', name: 'Wrapped BNB', address: '0xf3074054737b9e83d73c3c17a007939e12698d5c' },
  { chain: 'apertum', symbol: 'wAVAX', name: 'Wrapped AVAX', address: '0xf75dd43f59cba81329f2fa3d98d0c0908cffebb8' },
  
  // BSC
  { chain: 'bsc', symbol: 'BNB', name: 'BNB', address: 'native' },
  { chain: 'bsc', symbol: 'USDT', name: 'Tether USD', address: '0x55d398326f99059ff775485246999027b3197955' },
  { chain: 'bsc', symbol: 'USDC', name: 'USD Coin', address: '0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d' },
  { chain: 'bsc', symbol: 'BTCB', name: 'BTCB Token', address: '0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c' },
  { chain: 'bsc', symbol: 'VOW', name: 'Vow Token', address: '0xF585B5b4f22816BAf7629AEA55B701662630397b' },
  { chain: 'bsc', symbol: 'TLN+', name: 'TLN+', address: '0x29280091Fa7F3ABe4739Ad5f1f7C5287feAf7736' },
  { chain: 'bsc', symbol: 'TLNx', name: 'TLNx', address: '0x3ddA9eA88136EceDe768CD374a2af37219da55e7' },
  { chain: 'bsc', symbol: 'v$', name: 'VOW Dollar USA', address: '0x9C23942Ca2C35e06d1d20747F33705983A18d2AB' },
  { chain: 'bsc', symbol: 'TLN', name: 'TLN Token', address: '0xf7d142a354322C7560250CaA0e2a06c89649e4C2' },
  { chain: 'bsc', symbol: 'vUSD', name: 'vUSD Token', address: '0xc0D8DaA6516BaB4eFCe440860987E735BaB44160' },
  
  // Ethereum
  { chain: 'eth', symbol: 'ETH', name: 'Ethereum', address: 'native' },
  { chain: 'eth', symbol: 'v$', name: 'VOW Dollar USA', address: '0xBa7fE208E0167e4047a996e1Efea830515F433F8' },
  { chain: 'eth', symbol: 'VOW', name: 'Vow Token', address: '0x1BBf25e71EC48B84d773809B4bA55B6F4bE946Fb' },
  { chain: 'eth', symbol: 'vUSD', name: 'vUSD Token', address: '0x0fc6C0465C9739d4a42dAca22eB3b2CB0Eb9937A' },
  
  // Polygon
  { chain: 'polygon', symbol: 'POL', name: 'Polygon', address: 'native' }
];

const RPC = { bsc: 'https://bsc-dataseed.binance.org/' };

const COINGECKO_IDS = {
  'apertum-native': 'aptm',
  'bsc-native': 'binancecoin',
  'eth-native': 'ethereum',
  'polygon-native': 'matic-network'
};

const DEXSCREENER_CHAINS = {
  'apertum': 'avalanche',
  'bsc': 'bsc',
  'eth': 'ethereum',
  'polygon': 'polygon'
};

const PAIR_ABI = [
  "function getReserves() view returns (uint112,uint112,uint32)",
  "function token0() view returns (address)",
  "function token1() view returns (address)"
];

function formatSwiss(num, decimals = 2) {
  if (num === null || num === undefined) return '-';
  const fixed = num.toFixed(decimals);
  const parts = fixed.split('.');
  const integerPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return parts[1] ? `$${integerPart}.${parts[1]}` : `$${integerPart}`;
}

async function fetchCoinGeckoPrice(coinId) {
  try {
    const url = `https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd`;
    const response = await fetch(url);
    if (!response.ok) return null;
    const data = await response.json();
    return data?.[coinId]?.usd || null;
  } catch (error) {
    return null;
  }
}

async function fetchDexScreenerPrice(address, chain) {
  try {
    const url = `https://api.dexscreener.com/latest/dex/tokens/${address}`;
    const response = await fetch(url);
    if (!response.ok) return null;
    
    const data = await response.json();
    if (!data?.pairs?.length) return null;
    
    const chainId = DEXSCREENER_CHAINS[chain];
    let pairs = data.pairs.filter(p => p.chainId === chainId);
    if (!pairs.length) pairs = data.pairs;
    if (!pairs.length) return null;
    
    const bestPair = pairs.reduce((best, current) => {
      const bestLiq = parseFloat(best.liquidity?.usd || 0);
      const currentLiq = parseFloat(current.liquidity?.usd || 0);
      return currentLiq > bestLiq ? current : best;
    });
    
    return parseFloat(bestPair.priceUsd);
  } catch (error) {
    return null;
  }
}

async function fetchPancakeSwapPrice(address) {
  try {
    const provider = new ethers.JsonRpcProvider(RPC.bsc);
    const FACTORY = "0xca143ce32fe78f1f7019d7d551a6402fc5350c73";
    const USDT = "0x55d398326f99059fF775485246999027B3197955";
    const FACTORY_ABI = ["function getPair(address,address) external view returns (address)"];
    
    const factory = new ethers.Contract(FACTORY, FACTORY_ABI, provider);
    const poolAddress = await factory.getPair(address, USDT);
    
    if (poolAddress === ethers.ZeroAddress) return null;
    
    const pair = new ethers.Contract(poolAddress, PAIR_ABI, provider);
    const [token0, token1, reserves] = await Promise.all([
      pair.token0(),
      pair.token1(),
      pair.getReserves()
    ]);
    
    const r0 = Number(ethers.formatUnits(reserves[0], 18));
    const r1 = Number(ethers.formatUnits(reserves[1], 18));
    
    if (token0.toLowerCase() === address.toLowerCase()) return r1 / r0;
    if (token1.toLowerCase() === address.toLowerCase()) return r0 / r1;
    
    return null;
  } catch (error) {
    return null;
  }
}

async function fetchTokenPrice(token) {
  // Stablecoins → Immer $1.00
  const stablecoins = ['USDT', 'USDC', 'wUSDT', 'wUSDC', 'vUSD'];
  if (stablecoins.includes(token.symbol)) {
    return { price: 1.00, source: 'Stablecoin (fest)' };
  }
  
  // Native Tokens → CoinGecko
  if (token.address === 'native') {
    const coinId = COINGECKO_IDS[`${token.chain}-native`];
    if (coinId) {
      const price = await fetchCoinGeckoPrice(coinId);
      if (price) return { price, source: 'CoinGecko' };
    }
  }
  
  // BSC Tokens → PancakeSwap zuerst
  if (token.chain === 'bsc' && token.address !== 'native') {
    const price = await fetchPancakeSwapPrice(token.address);
    if (price) return { price, source: 'PancakeSwap V2' };
  }
  
  // Fallback → DexScreener
  if (token.address !== 'native') {
    const price = await fetchDexScreenerPrice(token.address, token.chain);
    if (price) return { price, source: 'DexScreener' };
  }
  
  return { price: null, source: 'Nicht verfügbar' };
}

function renderTokens() {
  const container = document.getElementById('tokenContainer');
  const chains = [...new Set(TOKENS.map(t => t.chain))];
  
  document.getElementById('chainCount').textContent = chains.length;
  document.getElementById('tokenCount').textContent = TOKENS.length;
  
  let html = '';
  
  chains.forEach(chain => {
    const chainTokens = TOKENS.filter(t => t.chain === chain);
    
    html += `
      <div class="chain-section">
        <div class="chain-header">
          <div class="chain-name">${chain.toUpperCase()}</div>
          <div class="chain-count">${chainTokens.length} Tokens</div>
        </div>
        <div class="token-grid">
    `;
    
    chainTokens.forEach((token, index) => {
      const id = `token-${chain}-${index}`;
      html += `
        <div class="token-card">
          <div class="token-header">
            <div class="token-symbol">${token.symbol}</div>
            <div class="token-badge">${chain}</div>
          </div>
          <div class="token-name">${token.name}</div>
          <div class="token-price loading" id="${id}">
            <span class="loading-spinner"></span> Lädt...
          </div>
          <div class="token-address" title="${token.address}">
            ${token.address === 'native' ? 'Native Token' : token.address}
          </div>
          <div class="token-source" id="${id}-source"></div>
        </div>
      `;
    });
    
    html += `</div></div>`;
  });
  
  container.innerHTML = html;
}

async function loadPrices() {
  let priceCount = 0;
  
  for (let i = 0; i < TOKENS.length; i += 5) {
    const batch = TOKENS.slice(i, i + 5);
    
    await Promise.all(batch.map(async (token, batchIndex) => {
      const index = i + batchIndex;
      const id = `token-${token.chain}-${TOKENS.filter(t => t.chain === token.chain).indexOf(token)}`;
      const el = document.getElementById(id);
      const sourceEl = document.getElementById(`${id}-source`);
      
      if (!el) return;
      
      try {
        const result = await fetchTokenPrice(token);
        
        if (result.price !== null) {
          const decimals = result.price >= 1000 ? 2 : result.price >= 1 ? 4 : result.price >= 0.01 ? 6 : 8;
          el.innerHTML = formatSwiss(result.price, decimals);
          el.classList.remove('loading');
          sourceEl.textContent = `Quelle: ${result.source}`;
          priceCount++;
        } else {
          el.innerHTML = 'Kein Preis';
          el.classList.remove('loading');
          el.classList.add('error');
          sourceEl.textContent = `Quelle: ${result.source}`;
        }
      } catch (error) {
        el.innerHTML = 'Fehler';
        el.classList.remove('loading');
        el.classList.add('error');
      }
      
      document.getElementById('priceCount').textContent = priceCount;
    }));
  }
}

(async () => {
  renderTokens();
  await loadPrices();
  
  const now = new Date();
  const swissTime = new Intl.DateTimeFormat('de-CH', {
    timeZone: 'Europe/Zurich',
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  }).format(now);
  
  document.getElementById('timestamp').textContent = `Letzte Aktualisierung: ${swissTime} (Schweizer Zeit)`;
})();
</script>

</body>
</html>
