// ---------- CoinGecko Batch Cache ----------
const COINGECKO_TTL = 60 * 1000;
let coingeckoCache = { ts: 0, data: {} };
let coingeckoSymbolMap = JSON.parse(
  localStorage.getItem('cg_symbol_map') || '{}'
);

// ---------- bekannte Native Coins ----------
const nativeCoinMap = {
  eth: 'ethereum',
  bsc: 'binancecoin',
  polygon: 'polygon-ecosystem-token',
  apertum: 'apertum'
};

// ---------- CoinGecko Batch ----------
async function fetchCoingeckoBatch(extraIds = []) {
  const now = Date.now();
  if (now - coingeckoCache.ts < COINGECKO_TTL) {
    return coingeckoCache.data;
  }

  const ids = new Set(Object.values(nativeCoinMap));

  extraIds.forEach(id => ids.add(id));

  const url =
    `https://api.coingecko.com/api/v3/simple/price` +
    `?ids=${[...ids].join(',')}` +
    `&vs_currencies=usd&include_24hr_change=true`;

  try {
    const r = await fetch(url);
    if (!r.ok) return {};
    const data = await r.json();
    coingeckoCache = { ts: now, data };
    return data;
  } catch {
    return {};
  }
}

// ---------- CoinGecko Symbol Search (Mini-Schritt) ----------
async function resolveCoinGeckoIdBySymbol(symbol) {
  const sym = symbol.toLowerCase();
  if (coingeckoSymbolMap[sym]) return coingeckoSymbolMap[sym];

  try {
    const r = await fetch(
      `https://api.coingecko.com/api/v3/search?query=${sym}`
    );
    const j = await r.json();
    if (j.coins?.length) {
      const id = j.coins[0].id;
      coingeckoSymbolMap[sym] = id;
      localStorage.setItem(
        'cg_symbol_map',
        JSON.stringify(coingeckoSymbolMap)
      );
      return id;
    }
  } catch {}

  return null;
}

// ---------- PATCHED fetchTokenPrice ----------
async function fetchTokenPrice(tokenAddress, chain, tokenSymbol) {

  // 1️⃣ Native Coins → CoinGecko
  if (tokenAddress === 'native') {
    const id = nativeCoinMap[chain];
    if (id) {
      const cg = await fetchCoingeckoBatch();
      if (cg[id]?.usd) return cg[id].usd;
    }
  }

  // 2️⃣ ERC-20 → DexScreener
  if (tokenAddress !== 'native') {
    const chainId = dexScreenerChainIds[chain];
    if (chainId) {
      try {
        const r = await fetch(
          `https://api.dexscreener.com/latest/dex/tokens/${tokenAddress}`
        );
        const j = await r.json();
        if (j.pairs?.length) {
          const pairs = j.pairs.filter(p => p.chainId === chainId);
          const best = (pairs.length ? pairs : j.pairs)
            .sort((a,b)=>
              (b.liquidity?.usd||0)-(a.liquidity?.usd||0)
            )[0];
          if (best?.priceUsd) {
            return parseFloat(best.priceUsd);
          }
        }
      } catch {}
    }
  }

  // 3️⃣ Fallback: CoinGecko Symbol Search (neue Tokens!)
  if (tokenSymbol) {
    const id = await resolveCoinGeckoIdBySymbol(tokenSymbol);
    if (id) {
      const cg = await fetchCoingeckoBatch([id]);
      if (cg[id]?.usd) return cg[id].usd;
    }
  }

  return null;
}
