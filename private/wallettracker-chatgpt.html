<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
<script src="https://apis.google.com/js/api.js"></script>

<script>
/* =========================================================
   ORIGINAL JAVASCRIPT – UNVERÄNDERT BIS ZUR PREISLOGIK
========================================================= */

/* ===== FIX #1: KORREKTE COINGECKO IDS ===== */
const coinIds = {
    eth: 'ethereum',
    bsc: 'binancecoin',
    polygon: 'polygon-ecosystem-token', // ✔ FIX
    apertum: 'apertum'                  // ✔ FIX
};

/* ===== FIX #2: MINI CACHE ===== */
const nativeTokenPriceCache = {};
const COINGECKO_TTL = 60 * 1000;

/* ===== PATCHED fetchTokenPrice (SIGNATUR BLEIBT GLEICH) ===== */
async function fetchTokenPrice(tokenAddress, chain) {

    // ===== Native Tokens =====
    if (tokenAddress === 'native') {
        const coinId = coinIds[chain];
        if (!coinId) return null;

        const cached = nativeTokenPriceCache[coinId];
        if (cached && Date.now() - cached.ts < COINGECKO_TTL) {
            return cached.price;
        }

        try {
            const url =
                `https://api.coingecko.com/api/v3/simple/price` +
                `?ids=${coinId}&vs_currencies=usd`;

            const response = await fetch(url);
            if (!response.ok) return null;

            const data = await response.json();
            if (data?.[coinId]?.usd) {
                nativeTokenPriceCache[coinId] = {
                    price: data[coinId].usd,
                    ts: Date.now()
                };
                return data[coinId].usd;
            }
        } catch {
            return null;
        }
    }

    // ===== ERC20 TOKENS (ORIGINAL LOGIK UNVERÄNDERT) =====
    try {
        const response = await fetch(
            `https://api.dexscreener.com/latest/dex/tokens/${tokenAddress}`
        );
        const data = await response.json();

        if (data.pairs && data.pairs.length > 0) {
            const bestPair = data.pairs.sort(
                (a, b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0)
            )[0];
            return bestPair?.priceUsd ? parseFloat(bestPair.priceUsd) : null;
        }
    } catch {
        return null;
    }

    return null;
}

/* =========================================================
   RESTLICHER ORIGINAL-CODE – UNVERÄNDERT
========================================================= */
</script>
