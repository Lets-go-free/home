<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .timestamp { font-size: 14px; opacity: 0.9; }

        .login-box p { margin-bottom: 30px; color: #718096; }
        #google-signin-button { margin: 0 auto; }
        .app-content { display: none; }
        .app-content.loaded { display: block; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-label { font-size: 14px; color: #718096; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; color: #2d3748; }
        .controls { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }

        .filter-group label { color: #4a5568; font-size: 14px; font-weight: 600; white-space: nowrap; }
        .filter-select { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; min-width: 200px; background: white; cursor: pointer; }

        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .table-container { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; }
        .table-wrapper { overflow-y: auto; overflow-x: auto; max-height: 60vh; }
        .table-wrapper::-webkit-scrollbar { width: 10px; }
        .table-wrapper::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 15px; text-align: left; font-weight: 600; color: #2d3748; font-size: 13px; border-bottom: 2px solid #e2e8f0; cursor: pointer; user-select: none; background: #f7fafc; position: sticky; top: 0; z-index: 10; }
        th:hover { background: #edf2f7; }
        tbody tr { border-bottom: 1px solid #e2e8f0; transition: background 0.2s; }
        tbody tr:hover { background: #f7fafc; }
        tr.group-header { background: #edf2f7; font-weight: 600; }
        tr.group-header td { padding: 12px 15px; color: #2d3748; font-size: 14px; border-top: 2px solid #cbd5e0; }
        tr.subtotal-row { background: #f7fafc; font-weight: 600; border-top: 1px solid #cbd5e0; }
        tr.subtotal-row td { color: #4a5568; font-style: italic; }
        tr.total-row { background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%); font-weight: 700; border-top: 2px solid #667eea; border-bottom: 2px solid #667eea; }
        tr.total-row td { color: #2d3748; font-size: 14px; padding: 15px; }
        td { padding: 10px 15px; color: #4a5568; font-size: 13px; }
        .token-info { display: flex; align-items: center; gap: 12px; }
        .token-icon { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 11px; }
        .token-details { display: flex; flex-direction: column; }
        .token-symbol { font-weight: 600; color: #2d3748; font-size: 13px; }
        .token-chain { font-size: 10px; color: #a0aec0; text-transform: uppercase; }
        .balance { font-weight: 600; color: #2d3748; text-align: right; font-size: 13px; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { background: #fed7d7; color: #c53030; padding: 20px; border-radius: 8px; margin: 20px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #718096; }
    </style>
</head>

async function loadSheetsData(){try{console.log('📊 Lade Daten aus Google Sheets...');const wr=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:GOOGLE_CONFIG.spreadsheetId,range:'Wallets!A2:B'});const wRows=wr.result.values;if(wRows&&wRows.length>0){wallets=wRows.map(r=>({name:r[0],address:r[1]}));console.log(`✓ ${wallets.length} Wallets geladen`);}const tr=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:GOOGLE_CONFIG.spreadsheetId,range:'Tokens!A2:E'});const tRows=tr.result.values;if(tRows&&tRows.length>0){tokens={};tRows.forEach(r=>{const c=r[0];if(!tokens[c])tokens[c]=[];tokens[c].push({symbol:r[1],name:r[2],address:r[3],decimals:18});});console.log(`✓ ${tRows.length} Tokens geladen`);}}catch(e){console.error('Fehler beim Laden der Sheets:',e);document.getElementById('loginStatus').textContent='Fehler: '+e.message;}}

async function fetchUniswapV2Price(addr,w3){
const cacheKey=`uni-v2-${addr}`;
const cached=getCachedPrice(cacheKey);
if(cached){console.log(`    ✓ Cache Hit: Uniswap V2`);return cached;}
try{
console.log(`  💱 Uniswap V2: ${addr}`);
const F="0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f";
const U="0xdAC17F958D2ee523a2206206994597C13D831ec7";
const FA=["function getPair(address,address) external view returns (address)"];
const PA=["function getReserves() view returns (uint112,uint112,uint32)","function token0() view returns (address)","function token1() view returns (address)"];
const fc=new w3.eth.Contract(FA,F);
await delay(500);
const pool=await fc.methods.getPair(addr,U).call();
if(pool==='0x0000000000000000000000000000000000000000')return null;
const pc=new w3.eth.Contract(PA,pool);
const[t0,t1,res]=await Promise.all([pc.methods.token0().call(),pc.methods.token1().call(),pc.methods.getReserves().call()]);
let tR,uR;
if(t0.toLowerCase()===addr.toLowerCase()){
tR=parseFloat(res[0])/Math.pow(10,18);
uR=parseFloat(res[1])/Math.pow(10,6);
}else if(t1.toLowerCase()===addr.toLowerCase()){
tR=parseFloat(res[1])/Math.pow(10,18);
uR=parseFloat(res[0])/Math.pow(10,6);
}else return null;
const p=uR/tR;
console.log(`    ✓ Uniswap V2: $${p.toFixed(6)}`);
setCachedPrice(cacheKey,p);
return p;
}catch(e){
console.log(`    ⚠️ Uniswap V2 Error:`,e.message);
return null;
}
}

async function fetchTokenPrice(addr,chain){
try{
if(addr==='native'){
const coinIds={'eth':'ethereum','bsc':'binancecoin','polygon':'matic-network','apertum':'aptm'};
const cid=coinIds[chain];
if(!cid)return null;
if(nativeTokenPriceCache[cid])return nativeTokenPriceCache[cid];
const u=`https://api.coingecko.com/api/v3/simple/price?ids=${cid}&vs_currencies=usd`;
await delay(600);const r=await fetch(u);
if(!r.ok)return null;
const d=await r.json();
if(d&&d[cid]&&d[cid].usd){
nativeTokenPriceCache[cid]=d[cid].usd;
return d[cid].usd;
}
return null;
}
if(chain==="eth"){
let p=await fetchUniswapV2Price(addr,web3Instances["eth"]);
if(p)return p;
p=await fetchUniswapV2ViaWETH(addr,web3Instances["eth"]);
if(p)return p;
}
const dexCacheKey=`dex-${chain}-${addr}`;
const dexCached=getCachedPrice(dexCacheKey);
if(dexCached){console.log(`    ✓ Cache Hit: DexScreener`);return dexCached;}
const cid=dexScreenerChainIds[chain];
const u=`https://api.dexscreener.com/latest/dex/tokens/${addr}`;
await delay(600);const r=await fetch(u);
if(!r.ok)return null;
const d=await r.json();
if(d&&d.pairs&&d.pairs.length>0){
let p=d.pairs.filter(x=>x.chainId===cid);
if(p.length===0)p=d.pairs;
if(p.length>0){
const best=p.reduce((b,c)=>{
const bL=parseFloat(b.liquidity?.usd||0);
const cL=parseFloat(c.liquidity?.usd||0);
return cL>bL?c:b;
});
const finalPrice=parseFloat(best.priceUsd);
setCachedPrice(dexCacheKey,finalPrice);
return finalPrice;
}
}
return null;
}catch{
return null;
}
