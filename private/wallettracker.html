<script>
/* === Native Coin Mapping (FIXED) === */
const __nativeCoinMap = {
    eth: 'ethereum',
    bsc: 'binancecoin',
    polygon: 'polygon-ecosystem-token',
    apertum: 'apertum'
};

/* === CoinGecko Batch Cache === */
let __cgCache = { ts: 0, data: {} };
const __CG_TTL = 60 * 1000;

/* === Batch Fetch === */
async function __fetchCgBatch(ids) {
    if (Date.now() - __cgCache.ts < __CG_TTL) {
        return __cgCache.data;
    }
    try {
        const url =
            `https://api.coingecko.com/api/v3/simple/price` +
            `?ids=${ids.join(',')}&vs_currencies=usd&include_24hr_change=true`;

        const r = await fetch(url);
        const j = await r.json();
        __cgCache = { ts: Date.now(), data: j };
        return j;
    } catch {
        return {};
    }
}

/* === PATCHED fetchTokenPrice (OVERRIDES ORIGINAL) === */
async function fetchTokenPrice(tokenAddress, chain, tokenSymbol) {

    /* 1️⃣ Native Coins */
    if (tokenAddress === 'native' && __nativeCoinMap[chain]) {
        const id = __nativeCoinMap[chain];
        const cg = await __fetchCgBatch([id]);
        return cg[id]?.usd ?? null;
    }

    /* 2️⃣ ERC-20 via DexScreener */
    if (tokenAddress !== 'native') {
        try {
            const r = await fetch(
                `https://api.dexscreener.com/latest/dex/tokens/${tokenAddress}`
            );
            const j = await r.json();
            if (j.pairs?.length) {
                return parseFloat(j.pairs[0].priceUsd);
            }
        } catch {}
    }

    /* 3️⃣ Fallback per Symbol (neue Tokens aus Sheets!) */
    const symMap = {
        btc: 'bitcoin',
        sol: 'solana',
        xrp: 'ripple',
        ada: 'cardano',
        dot: 'polkadot',
        avax: 'avalanche-2'
    };

    const id = symMap[tokenSymbol?.toLowerCase()];
    if (id) {
        const cg = await __fetchCgBatch([id]);
        return cg[id]?.usd ?? null;
    }

    return null;
}
</script>
