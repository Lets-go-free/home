// Price Cache & Delay
const priceCache={},CACHE_DURATION=60000;
function getCachedPrice(key){const cached=priceCache[key];if(!cached)return null;if(Date.now()-cached.timestamp>CACHE_DURATION){delete priceCache[key];return null;}return cached.price;}
function setCachedPrice(key,price){priceCache[key]={price:price,timestamp:Date.now()};}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

// Price Table
const globalPriceMap=new Map();
let priceTableVisible=false;
function togglePriceTable(){priceTableVisible=!priceTableVisible;document.getElementById('priceTableContent').style.display=priceTableVisible?'block':'none';}

async function loadPrices(){
try{
console.log('💰 Starte Preis-Ladung...');
const btn=document.getElementById('loadPricesBtn');
const status=document.getElementById('priceTableStatus');
btn.disabled=true;
btn.textContent='⏳ Lädt...';
status.textContent='Lade Preise...';
const uniqueTokens=new Map();
for(const [chain,tokenList] of Object.entries(tokens)){tokenList.forEach(token=>{const key=`${chain}-${token.address}`;if(!uniqueTokens.has(key)){uniqueTokens.set(key,{chain:chain,address:token.address,symbol:token.symbol,name:token.name});}});}
console.log(`📊 Lade ${uniqueTokens.size} unique Token-Preise...`);
status.textContent=`Lade ${uniqueTokens.size} Token-Preise...`;
const priceData=[];
let loaded=0;
for(const [key,token] of uniqueTokens){
try{
const startTime=Date.now();
const price=await fetchTokenPrice(token.address,token.chain);
const loadTime=Date.now()-startTime;
const priceInfo={chain:token.chain,symbol:token.symbol,name:token.name,address:token.address,price:price,source:price?'API':'N/A',timestamp:new Date().toLocaleTimeString('de-CH'),loadTime:loadTime};
priceData.push(priceInfo);
globalPriceMap.set(key,price);
loaded++;
status.textContent=`Geladen: ${loaded}/${uniqueTokens.size} (${priceInfo.symbol}: ${price?'$'+formatNumber(price):'N/A'})`;
displayPriceTable(priceData);
}catch(e){console.error(`Fehler bei ${token.symbol}:`,e);}
}
console.log(`✅ ${loaded} Preise geladen`);
status.textContent=`${loaded} Preise geladen - Letzte Aktualisierung: ${new Date().toLocaleTimeString('de-CH')}`;
btn.textContent='🔄 Neu laden';
btn.disabled=false;
updateBalanceTableWithPrices();
if(!priceTableVisible)togglePriceTable();
}catch(e){console.error('Fehler:',e);document.getElementById('priceTableStatus').textContent='Fehler: '+e.message;document.getElementById('loadPricesBtn').disabled=false;}
}

function displayPriceTable(priceData){
const content=document.getElementById('priceTableContent');
if(priceData.length===0){content.innerHTML='<div style="padding:20px;text-align:center;color:#718096;">Keine Preise geladen</div>';return;}
let html='<div style="overflow-x:auto;max-height:400px;overflow-y:auto;"><table style="width:100%;border-collapse:collapse;"><thead style="position:sticky;top:0;background:#f7fafc;z-index:10;"><tr><th style="padding:12px 15px;text-align:left;font-size:12px;color:#2d3748;border-bottom:2px solid #e2e8f0;">Chain</th><th style="padding:12px 15px;text-align:left;font-size:12px;color:#2d3748;border-bottom:2px solid #e2e8f0;">Token</th><th style="padding:12px 15px;text-align:right;font-size:12px;color:#2d3748;border-bottom:2px solid #e2e8f0;">Preis (USD)</th><th style="padding:12px 15px;text-align:center;font-size:12px;color:#2d3748;border-bottom:2px solid #e2e8f0;">Quelle</th><th style="padding:12px 15px;text-align:center;font-size:12px;color:#2d3748;border-bottom:2px solid #e2e8f0;">Zeit</th></tr></thead><tbody>';
priceData.forEach((item,index)=>{const bgColor=index%2===0?'#ffffff':'#f7fafc';html+=`<tr style="background:${bgColor};border-bottom:1px solid #e2e8f0;"><td style="padding:10px 15px;"><span style="display:inline-block;padding:4px 8px;background:rgba(102,126,234,0.1);color:#667eea;border-radius:4px;font-size:11px;font-weight:600;">${item.chain.toUpperCase()}</span></td><td style="padding:10px 15px;"><div style="font-weight:600;color:#2d3748;font-size:13px;">${item.symbol}</div><div style="font-size:11px;color:#94a3b8;">${item.name}</div></td><td style="padding:10px 15px;text-align:right;font-family:monospace;font-weight:600;color:${item.price?'#22c55e':'#ef4444'};">${item.price?'$'+formatNumber(item.price):'N/A'}</td><td style="padding:10px 15px;text-align:center;font-size:11px;color:#718096;">${item.source}</td><td style="padding:10px 15px;text-align:center;font-size:11px;color:#94a3b8;">${item.timestamp}</td></tr>`;});
html+='</tbody></table></div>';
content.innerHTML=html;
}

function updateBalanceTableWithPrices(){
allBalances.forEach(item=>{const key=`${item.chain}-${item.tokenAddress}`;const price=globalPriceMap.get(key);if(price){item.priceUsd=price;if(item.balance>0){item.valueUsd=item.balance*price;}}});
displayTable();
updateStats();
}

// Uniswap V2
async function fetchUniswapV2Price(addr,w3){
const cacheKey=`uni-v2-${addr}`;
const cached=getCachedPrice(cacheKey);
if(cached){console.log(`    ✓ Cache: Uniswap V2`);return cached;}
try{
await delay(1500);
const F="0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f";
const U="0xdAC17F958D2ee523a2206206994597C13D831ec7";
const FA=["function getPair(address,address) external view returns (address)"];
const PA=["function getReserves() view returns (uint112,uint112,uint32)","function token0() view returns (address)","function token1() view returns (address)"];
const fc=new w3.eth.Contract(FA,F);
const pool=await fc.methods.getPair(addr,U).call();
if(pool==='0x0000000000000000000000000000000000000000')return null;
await delay(500);
const pc=new w3.eth.Contract(PA,pool);
const[t0,t1,res]=await Promise.all([pc.methods.token0().call(),pc.methods.token1().call(),pc.methods.getReserves().call()]);
let tR,uR;
if(t0.toLowerCase()===addr.toLowerCase()){tR=parseFloat(res[0])/Math.pow(10,18);uR=parseFloat(res[1])/Math.pow(10,6);}
else if(t1.toLowerCase()===addr.toLowerCase()){tR=parseFloat(res[1])/Math.pow(10,18);uR=parseFloat(res[0])/Math.pow(10,6);}
else return null;
const p=uR/tR;
console.log(`    ✓ Uniswap V2: $${p.toFixed(6)}`);
setCachedPrice(cacheKey,p);
return p;
}catch(e){console.log(`    ⚠️ Uniswap V2:`,e.message);return null;}
}

async function fetchUniswapV2ViaWETH(addr,w3){
const cacheKey=`uni-v2-weth-${addr}`;
const cached=getCachedPrice(cacheKey);
if(cached){console.log(`    ✓ Cache: Uniswap V2 via WETH`);return cached;}
try{
await delay(1500);
const F="0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f";
const W="0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2";
const U="0xdAC17F958D2ee523a2206206994597C13D831ec7";
const FA=["function getPair(address,address) external view returns (address)"];
const PA=["function getReserves() view returns (uint112,uint112,uint32)","function token0() view returns (address)","function token1() view returns (address)"];
const fc=new w3.eth.Contract(FA,F);
const twp=await fc.methods.getPair(addr,W).call();
if(twp==='0x0000000000000000000000000000000000000000')return null;
await delay(500);
const twc=new w3.eth.Contract(PA,twp);
const[tw0,tw1,twr]=await Promise.all([twc.methods.token0().call(),twc.methods.token1().call(),twc.methods.getReserves().call()]);
let tR,wR;
if(tw0.toLowerCase()===addr.toLowerCase()){tR=parseFloat(twr[0])/Math.pow(10,18);wR=parseFloat(twr[1])/Math.pow(10,18);}
else{tR=parseFloat(twr[1])/Math.pow(10,18);wR=parseFloat(twr[0])/Math.pow(10,18);}
const tpw=wR/tR;
await delay(500);
const wup=await fc.methods.getPair(W,U).call();
if(wup==='0x0000000000000000000000000000000000000000')return null;
const wuc=new w3.eth.Contract(PA,wup);
const[wu0,wu1,wur]=await Promise.all([wuc.methods.token0().call(),wuc.methods.token1().call(),wuc.methods.getReserves().call()]);
let wRu,uR;
if(wu0.toLowerCase()===W.toLowerCase()){wRu=parseFloat(wur[0])/Math.pow(10,18);uR=parseFloat(wur[1])/Math.pow(10,6);}
else{wRu=parseFloat(wur[1])/Math.pow(10,18);uR=parseFloat(wur[0])/Math.pow(10,6);}
const wpu=uR/wRu;
const p=tpw*wpu;
console.log(`    ✓ Uniswap V2 via WETH: $${p.toFixed(6)}`);
setCachedPrice(cacheKey,p);
return p;
}catch(e){console.log(`    ⚠️ Uniswap V2 via WETH:`,e.message);return null;}
}

// Fetch Token Price
const nativeTokenPriceCache={};
const dexScreenerChainIds={apertum:'apertum',bsc:'bsc',eth:'ethereum',polygon:'polygon'};
async function fetchTokenPrice(addr,chain){
try{
if(addr==='native'){
const coinIds={'eth':'ethereum','bsc':'binancecoin','polygon':'matic-network','apertum':'aptm'};
const cid=coinIds[chain];
if(!cid)return null;
if(nativeTokenPriceCache[cid])return nativeTokenPriceCache[cid];
await delay(800);
const u=`https://api.coingecko.com/api/v3/simple/price?ids=${cid}&vs_currencies=usd`;
const r=await fetch(u);
if(!r.ok)return null;
const d=await r.json();
if(d&&d[cid]&&d[cid].usd){nativeTokenPriceCache[cid]=d[cid].usd;return d[cid].usd;}
return null;
}
if(chain==='eth'){
let p=await fetchUniswapV2Price(addr,web3Instances['eth']);
if(p)return p;
p=await fetchUniswapV2ViaWETH(addr,web3Instances['eth']);
if(p)return p;
}
const dexKey=`dex-${chain}-${addr}`;
const dexCached=getCachedPrice(dexKey);
if(dexCached){console.log(`    ✓ Cache: DexScreener`);return dexCached;}
await delay(800);
const cid=dexScreenerChainIds[chain];
const u=`https://api.dexscreener.com/latest/dex/tokens/${addr}`;
const r=await fetch(u);
if(!r.ok)return null;
const d=await r.json();
if(d&&d.pairs&&d.pairs.length>0){
let p=d.pairs.filter(x=>x.chainId===cid);
if(p.length===0)p=d.pairs;
if(p.length>0){
const best=p.reduce((b,c)=>{const bL=parseFloat(b.liquidity?.usd||0);const cL=parseFloat(c.liquidity?.usd||0);return cL>bL?c:b;});
const price=parseFloat(best.priceUsd);
setCachedPrice(dexKey,price);
return price;
}
}
return null;
}catch(e){console.log(`    ⚠️ fetchTokenPrice:`,e.message);return null;}
}

// Google Sheets
async function loadSheetsData(){
console.log('📊 Lade Daten aus Google Sheets...');
const wresp=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:GOOGLE_CONFIG.spreadsheetId,range:'Wallets!A2:B'});
const wrows=wresp.result.values||[];
wallets=wrows.map(r=>({name:r[0],address:r[1]}));
console.log(`✓ ${wallets.length} Wallets geladen`);
const tresp=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:GOOGLE_CONFIG.spreadsheetId,range:'Tokens!A2:E'});
const trows=tresp.result.values||[];
tokens={};
trows.forEach(r=>{const chain=r[0];if(!tokens[chain])tokens[chain]=[];tokens[chain].push({chain:chain,symbol:r[1],name:r[2],address:r[3],decimals:r[4]?parseInt(r[4]):null});});
console.log(`✓ ${trows.length} Tokens geladen`);
}

// Web3
function initializeWeb3(){
console.log('🔧 Initialisiere Web3...');
Object.keys(tokens).forEach(chain=>{
const endpoint = rpcEndpoints[chain];
// Wenn es ein Array ist, nimm den ersten RPC
const rpc = Array.isArray(endpoint) ? endpoint[0] : endpoint;
web3Instances[chain]=new Web3(rpc);
console.log(`✓ Web3 für ${chain} initialisiert (RPC: ${Array.isArray(endpoint) ? endpoint.length + ' Fallbacks' : 'einzeln'})`);
});
loadAllWallets();
}

console.log('🚀 Starte Laden der Wallets...');
const c=document.getElementById('tableContent');
c.innerHTML='<div class="loading"><div class="spinner"></div><p>Lade Token-Daten...</p><p style="font-size:12px;margin-top:10px;" id="loadingStatus">Initialisiere...</p></div>';
allBalances=[];
const tasks=[];
for(const w of wallets){
for(const[ch,tl]of Object.entries(tokens)){
const w3=web3Instances[ch];
for(const t of tl){
const task=(async()=>{
console.log(`🔍 ${w.name} - ${t.symbol} (${ch})`);

try{
let bal,tn=t.name,ts=t.symbol,dec=t.decimals;
if(t.address==='native'){
const wb=await w3.eth.getBalance(w.address);
bal=parseFloat(w3.utils.fromWei(wb,'ether'));
}else{
const ct=new w3.eth.Contract(ERC20_ABI,t.address);
try{dec=await ct.methods.decimals().call();dec=parseInt(dec);}catch(e){console.log(`    ✗ ${w.name}-${t.symbol}(${ch}): ${e.message}`);return null;}
try{const rb=await ct.methods.balanceOf(w.address).call();bal=parseFloat(rb)/Math.pow(10,dec);}catch(e){console.log(`    ✗ ${w.name}-${t.symbol}(${ch}): ${e.message}`);return null;}
if(bal>0){
try{const[fn,fs]=await Promise.all([ct.methods.name().call().catch(()=>t.name),ct.methods.symbol().call().catch(()=>t.symbol)]);tn=fn;ts=fs;}catch(e){console.log(`    ⚠️ Name/Symbol Fehler: ${e.message}`)}
}
}
if(bal>0){return{wallet:w.name,walletAddress:w.address,tokenSymbol:ts,tokenName:tn,chain:ch,balance:bal,tokenAddress:t.address,decimals:dec,priceUsd:null,valueUsd:null};}
return null;
}catch(e){console.log(`    ✗ ${w.name}-${t.symbol}(${ch}): ${e.message}`);return null;}
})();
tasks.push(task);
}
}
}
console.log(`⚡ Lade ${tasks.length} Token sequentiell (mit Delays)...`);
const results=[];
for(let i=0;i<tasks.length;i++){
const result=await tasks[i];
results.push(result);
if((i+1)%10===0){
console.log(`  → ${i+1}/${tasks.length} geprüft...`);
await delay(100);
}
}
allBalances=results.filter(i=>i!==null);
displayTable();
updateStats();
}catch(e){console.error('Fehler:',e);displayError('Fehler beim Laden: '+e.message);}
}

// Display
function displayTable(){
const c=document.getElementById('tableContent');
if(allBalances.length===0){c.innerHTML='<div class="empty-state"><p>Keine Token mit Balance gefunden.</p></div>';return;}
const h='<div class="table-wrapper"><table><thead><tr><th>Wallet</th><th>Token</th><th>Token-Adresse</th><th>Anzahl</th><th>Preis (USD)</th><th>Wert (USD)</th></tr></thead><tbody id="tableBody">'+generateTableRows()+'</tbody></table></div>';
c.innerHTML=h;
populateFilters();
}

function generateTableRows(){
const gb=document.getElementById('groupByFilter')?.value||'none';
if(gb==='none'){
return allBalances.map((it,i)=>`<tr data-index="${i}"><td>${it.wallet}</td><td><div class="token-info"><div class="token-icon">${it.tokenSymbol.charAt(0)}</div><div class="token-details"><div class="token-symbol">${it.tokenSymbol}</div><div class="token-chain">${it.chain}</div></div></div></td><td class="token-address-cell" title="${it.tokenAddress}">${it.tokenAddress==='native'?'Native':it.tokenAddress}</td><td class="balance">${formatNumber(it.balance)}</td><td class="balance">${it.priceUsd?'$'+formatNumber(it.priceUsd):'-'}</td><td class="balance">${it.valueUsd?'$'+formatNumber(it.valueUsd):'-'}</td></tr>`).join('');
}else{
const g={};
allBalances.forEach((it,i)=>{const k=it[gb]||'Unbekannt';if(!g[k])g[k]=[];g[k].push({...it,originalIndex:i});});
let h='';
Object.keys(g).sort().forEach(k=>{
const its=g[k];
const st=its.reduce((s,it)=>s+(it.valueUsd||0),0);
h+=`<tr class="group-header"><td colspan="6"><strong>${getGroupLabel(gb)}:</strong> ${k.toUpperCase()} ${st>0?`(Zwischentotal: $${formatNumber(st)})`:''}</td></tr>`;
its.forEach(it=>{h+=`<tr data-index="${it.originalIndex}"><td>${it.wallet}</td><td><div class="token-info"><div class="token-icon">${it.tokenSymbol.charAt(0)}</div><div class="token-details"><div class="token-symbol">${it.tokenSymbol}</div><div class="token-chain">${it.chain}</div></div></div></td><td class="token-address-cell" title="${it.tokenAddress}">${it.tokenAddress==='native'?'Native':it.tokenAddress}</td><td class="balance">${formatNumber(it.balance)}</td><td class="balance">${it.priceUsd?'$'+formatNumber(it.priceUsd):'-'}</td><td class="balance">${it.valueUsd?'$'+formatNumber(it.valueUsd):'-'}</td></tr>`;});
if(st>0){h+=`<tr class="subtotal-row"><td colspan="5" style="text-align:right;">Zwischentotal ${k}:</td><td class="balance">$${formatNumber(st)}</td></tr>`;}
});
const gt=allBalances.reduce((s,it)=>s+(it.valueUsd||0),0);
if(gt>0){h+=`<tr class="total-row"><td colspan="5" style="text-align:right;"><strong>GESAMT-TOTAL:</strong></td><td class="balance"><strong>$${formatNumber(gt)}</strong></td></tr>`;}
return h;
}
}

function getGroupLabel(gb){const l={'wallet':'Wallet','chain':'Chain','tokenSymbol':'Token'};return l[gb]||gb;}

function populateFilters(){
const uw=[...new Set(allBalances.map(i=>i.wallet))].sort();
const wf=document.getElementById('walletFilter');
wf.innerHTML='<option value="">Alle Wallets</option>';
uw.forEach(w=>{wf.innerHTML+=`<option value="${w}">${w}</option>`;});
const uc=[...new Set(allBalances.map(i=>i.chain))].sort();
const cf=document.getElementById('chainFilter');
cf.innerHTML='<option value="">Alle Chains</option>';
uc.forEach(c=>{cf.innerHTML+=`<option value="${c}">${c.toUpperCase()}</option>`;});
const ut=[...new Set(allBalances.map(i=>i.tokenSymbol))].sort();
const tf=document.getElementById('tokenFilter');
tf.innerHTML='<option value="">Alle Token</option>';
ut.forEach(t=>{tf.innerHTML+=`<option value="${t}">${t}</option>`;});
}

function applyFilters(){
const wf=document.getElementById('walletFilter').value;
const cf=document.getElementById('chainFilter').value;
const tf=document.getElementById('tokenFilter').value;
const fb=allBalances.filter(i=>{const mw=!wf||i.wallet===wf;const mc=!cf||i.chain===cf;const mt=!tf||i.tokenSymbol===tf;return mw&&mc&&mt;});
const tmp=allBalances;
allBalances=fb;
const tbody=document.getElementById('tableBody');
if(tbody){tbody.parentElement.parentElement.innerHTML='<table><thead><tr><th>Wallet</th><th>Token</th><th>Token-Adresse</th><th>Anzahl</th><th>Preis (USD)</th><th>Wert (USD)</th></tr></thead><tbody id="tableBody">'+generateTableRows()+'</tbody></table>';}
allBalances=tmp;
updateStatsFiltered(fb);
}

function updateStats(){
document.getElementById('walletCount').textContent=wallets.length;
document.getElementById('tokenCount').textContent=allBalances.length;
document.getElementById('chainCount').textContent=Object.keys(tokens).length;
const tv=allBalances.reduce((s,i)=>s+(i.valueUsd||0),0);
document.getElementById('portfolioValue').textContent=tv>0?'$'+formatNumber(tv):'-';
}

function updateStatsFiltered(fb){
const uw=new Set(fb.map(i=>i.wallet));
document.getElementById('walletCount').textContent=uw.size;
document.getElementById('tokenCount').textContent=fb.length;
const uc=new Set(fb.map(i=>i.chain));
document.getElementById('chainCount').textContent=uc.size;
const tv=fb.reduce((s,i)=>s+(i.valueUsd||0),0);
document.getElementById('portfolioValue').textContent=tv>0?'$'+formatNumber(tv):'-';
}

function formatNumber(n){
if(n===null||n===undefined)return'-';
let d;
if(n>=1000)d=2;
else if(n>=1)d=4;
else if(n>=0.01)d=6;
else d=8;
const f=n.toFixed(d);
const p=f.split('.');
const ip=p[0];
const dp=p[1];
const fi=ip.replace(/\B(?=(\d{3})+(?!\d))/g,"'");
return dp?`${fi}.${dp}`:fi;
}

function displayError(m){const c=document.getElementById('tableContent');c.innerHTML=`<div class="error">${m}</div>`;}

// Event Listeners
document.getElementById('walletFilter').addEventListener('change',applyFilters);
document.getElementById('chainFilter').addEventListener('change',applyFilters);
document.getElementById('tokenFilter').addEventListener('change',applyFilters);
document.getElementById('groupByFilter').addEventListener('change',applyFilters);

// Timestamp
setInterval(()=>{document.getElementById('timestamp').textContent=new Date().toLocaleString('de-CH');},1000);
    </script>
</body>
</html>
