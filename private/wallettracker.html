<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Multi-Wallet Token Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .timestamp { font-size: 14px; opacity: 0.9; }
        .version { font-size: 12px; opacity: 0.7; margin-top: 5px; }
        .login-box { background: white; border-radius: 15px; padding: 40px; max-width: 400px; margin: 100px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .login-box h2 { margin-bottom: 20px; color: #2d3748; }
        .login-box p { margin-bottom: 30px; color: #718096; }
        #google-signin-button { margin: 0 auto; }
        .app-content { display: none; }
        .app-content.loaded { display: block; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-label { font-size: 14px; color: #718096; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; color: #2d3748; }
        .controls { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .filter-group { display: flex; gap: 10px; align-items: center; }
        .filter-group label { color: #4a5568; font-size: 14px; font-weight: 600; white-space: nowrap; }
        .filter-select { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; min-width: 200px; background: white; cursor: pointer; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .table-container { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; }
        .table-wrapper { overflow-y: auto; overflow-x: auto; max-height: 60vh; }
        .table-wrapper::-webkit-scrollbar { width: 10px; }
        .table-wrapper::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-wrapper::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 15px; text-align: left; font-weight: 600; color: #2d3748; font-size: 13px; border-bottom: 2px solid #e2e8f0; cursor: pointer; user-select: none; background: #f7fafc; position: sticky; top: 0; z-index: 10; }
        th:hover { background: #edf2f7; }
        tbody tr { border-bottom: 1px solid #e2e8f0; transition: background 0.2s; }
        tbody tr:hover { background: #f7fafc; }
        tr.group-header { background: #edf2f7; font-weight: 600; }
        tr.group-header td { padding: 12px 15px; color: #2d3748; font-size: 14px; border-top: 2px solid #cbd5e0; }
        tr.subtotal-row { background: #f7fafc; font-weight: 600; border-top: 1px solid #cbd5e0; }
        tr.subtotal-row td { color: #4a5568; font-style: italic; }
        tr.total-row { background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%); font-weight: 700; border-top: 2px solid #667eea; border-bottom: 2px solid #667eea; }
        tr.total-row td { color: #2d3748; font-size: 14px; padding: 15px; }
        td { padding: 10px 15px; color: #4a5568; font-size: 13px; }
        .token-info { display: flex; align-items: center; gap: 12px; }
        .token-icon { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 11px; }
        .token-details { display: flex; flex-direction: column; }
        .token-symbol { font-weight: 600; color: #2d3748; font-size: 13px; }
        .token-chain { font-size: 10px; color: #a0aec0; text-transform: uppercase; }
        .balance { font-weight: 600; color: #2d3748; text-align: right; font-size: 13px; }
        .token-address-cell { font-family: 'Courier New', monospace; font-size: 11px; color: #718096; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .loading { text-align: center; padding: 60px 20px; color: #4a5568; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #667eea; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { background: #fed7d7; color: #c53030; padding: 20px; border-radius: 8px; margin: 20px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #718096; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Multi-Wallet Token Viewer</h1>
            <div class="version">Version: 09.01.2026 - Fixed All Chains</div>
            <div class="timestamp" id="timestamp"></div>
        </div>
        
        <div id="loginBox" class="login-box">

        </div>
        
        <div id="appContent" class="app-content">

                <div class="filter-group"><label for="chainFilter">Chain:</label><select id="chainFilter" class="filter-select"><option value="">Alle Chains</option></select></div>
                <div class="filter-group"><label for="tokenFilter">Token:</label><select id="tokenFilter" class="filter-select"><option value="">Alle Token</option></select></div>
                <div class="filter-group"><label for="groupByFilter">Gruppierung:</label><select id="groupByFilter" class="filter-select"><option value="none">Keine</option><option value="wallet">Nach Wallet</option><option value="chain">Nach Chain</option><option value="tokenSymbol">Nach Token</option></select></div>
                <button class="btn btn-primary" onclick="loadAllWallets()">🔄 Aktualisieren</button>
            </div>

            <div class="stats">
                <div class="stat-card"><div class="stat-label">Wallets</div><div class="stat-value" id="walletCount">-</div></div>
                <div class="stat-card"><div class="stat-label">Token gesamt</div><div class="stat-value" id="tokenCount">-</div></div>
                <div class="stat-card"><div class="stat-label">Portfolio-Wert</div><div class="stat-value" id="portfolioValue">-</div></div>

    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script>

    apiKey: 'AIzaSyCoJAYF8BVhYk8k2Zr2MbDAt2qwkaGEM8w',
    clientId: '42198403966-ovpg5lar1qso4vqfl9rd4ebeunltpegs.apps.googleusercontent.com',
    spreadsheetId: '1M0HycCitzlkgk_uG1Y-iLeYKthdUaRGnCvv3Hxv0yww',

// BSC, Polygon use Web3 with RPC endpoints
const RPC_ENDPOINTS = {
    bsc: 'https://bsc-dataseed.binance.org/',

};

const ERC20_ABI = [
    {"constant":true,"inputs":[],"name":"name","outputs":[{"name":"","type":"string"}],"type":"function"},
    {"constant":true,"inputs":[],"name":"decimals","outputs":[{"name":"","type":"uint8"}],"type":"function"},

let gapiInited = false;
let tokenClient;
let accessToken = null;
let wallets = [];
let tokens = {};
let allBalances = [];

function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

// Google Auth
function gapiLoaded() {
    gapi.load('client', async () => {
        await gapi.client.init({
            apiKey: GOOGLE_CONFIG.apiKey,
            discoveryDocs: GOOGLE_CONFIG.discoveryDocs
        });
        gapiInited = true;
        console.log('✓ GAPI initialisiert');
        maybeEnableButtons();
    });
}

function gisLoaded() {
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CONFIG.clientId,
        scope: GOOGLE_CONFIG.scopes,
        redirect_uri: window.location.origin + window.location.pathname,
        ux_mode: 'popup',
        callback: async (r) => {
            if (r.error !== undefined) {
                console.error('Token Error:', r);
                document.getElementById('loginStatus').textContent = 'Fehler: ' + r.error;
                return;
            }
            console.log('✓ Access Token erhalten');
            accessToken = r.access_token;
            await loadSheetsData();
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('appContent').classList.add('loaded');
            initializeWeb3();
        }
    });
    console.log('✓ GIS initialisiert');
    maybeEnableButtons();
}

function maybeEnableButtons() {
    if (gapiInited && tokenClient) {
        document.getElementById('loginStatus').textContent = 'Bereit zur Anmeldung';
        document.getElementById('google-signin-button').innerHTML = '<button class="btn btn-primary" onclick="handleAuthClick()" style="width:100%;padding:12px 24px;font-size:16px;">🔐 Mit Google anmelden</button>';
    }
}

function handleAuthClick() {
    console.log('🔐 Starte Authentifizierung...');
    document.getElementById('loginStatus').textContent = 'Authentifiziere...';
    if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({prompt: 'consent'});
    } else {
        tokenClient.requestAccessToken({prompt: ''});
    }
}

window.addEventListener('load', () => {
    gapiLoaded();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = gisLoaded;
    document.head.appendChild(s);
});

// Google Sheets
async function loadSheetsData() {
    try {
        console.log('📊 Lade Daten aus Google Sheets...');
        const wr = await gapi.client.sheets.spreadsheets.values.get({
            spreadsheetId: GOOGLE_CONFIG.spreadsheetId,
            range: 'Wallets!A2:B'
        });
        const wRows = wr.result.values;
        if (wRows && wRows.length > 0) {
            wallets = wRows.map(r => ({name: r[0], address: r[1]}));
            console.log(`✓ ${wallets.length} Wallets geladen`);
        }
        
        const tr = await gapi.client.sheets.spreadsheets.values.get({
            spreadsheetId: GOOGLE_CONFIG.spreadsheetId,
            range: 'Tokens!A2:E'
        });
        const tRows = tr.result.values;
        if (tRows && tRows.length > 0) {
            tokens = {};
            tRows.forEach(r => {
                const c = r[0];
                if (!tokens[c]) tokens[c] = [];
                tokens[c].push({
                    symbol: r[1],
                    name: r[2],
                    address: r[3],
                    decimals: r[4] ? parseInt(r[4]) : 18
                });
            });
            console.log(`✓ ${tRows.length} Tokens geladen`);
        }
    } catch (e) {
        console.error('Fehler beim Laden der Sheets:', e);
        document.getElementById('loginStatus').textContent = 'Fehler: ' + e.message;
    }
}

// Initialize Web3 for BSC and Polygon
async function initializeWeb3() {
    console.log('🔧 Initialisiere Web3 für BSC und Polygon...');
    for (const [chain, rpc] of Object.entries(RPC_ENDPOINTS)) {
        web3Instances[chain] = new Web3(rpc);
        console.log(`✓ Web3 für ${chain} initialisiert`);
    }
    loadAllWallets();
}

// Main loading function

    try {
        console.log('🚀 Starte Laden der Wallets...');
        const c = document.getElementById('tableContent');
        c.innerHTML = '<div class="loading"><div class="spinner"></div><p>Lade Token-Daten...</p><p style="font-size:12px;margin-top:10px;" id="loadingStatus">Initialisiere...</p></div>';
        
        const se = document.getElementById('loadingStatus');
        allBalances = [];
        
        for (const wallet of wallets) {
            // Apertum - use Block Explorer API
            if (tokens.apertum) {
                se.textContent = `Lade ${wallet.name} auf APERTUM...`;
                console.log(`📡 Lade ${wallet.name} auf apertum`);
                try {
                    const balances = await getApertumBalances(wallet);
                    allBalances.push(...balances);
                    console.log(`  ✓ ${balances.length} Tokens gefunden`);
                } catch (e) {
                    console.error(`  ✗ Fehler bei ${wallet.name} (apertum):`, e.message);
                }
                await delay(300);
            }
            
            // ETH - use Etherscan V2 API
            if (tokens.eth) {
                se.textContent = `Lade ${wallet.name} auf ETH...`;
                console.log(`📡 Lade ${wallet.name} auf eth`);
                try {
                    const balances = await getEthBalances(wallet);

                    console.log(`  ✓ ${balances.length} Tokens gefunden`);
                } catch (e) {
                    console.error(`  ✗ Fehler bei ${wallet.name} (eth):`, e.message);
                }
                await delay(300);
            }
            
            // BSC and Polygon - use Web3
            for (const chain of ['bsc', 'polygon']) {
                if (tokens[chain]) {
                    se.textContent = `Lade ${wallet.name} auf ${chain.toUpperCase()}...`;
                    console.log(`📡 Lade ${wallet.name} auf ${chain}`);
                    try {
                        const balances = await getWeb3Balances(wallet, chain);
                        allBalances.push(...balances);
                        console.log(`  ✓ ${balances.length} Tokens gefunden`);
                    } catch (e) {
                        console.error(`  ✗ Fehler bei ${wallet.name} (${chain}):`, e.message);
                    }
                    await delay(300);
                }
            }
        }
        
        console.log(`✅ ${allBalances.length} Token mit Balance gefunden`);
        displayTable();
        updateStats();
        
    } catch (e) {
        console.error('Fehler:', e);
        displayError('Fehler beim Laden: ' + e.message);
    }
}

// Apertum using Block Explorer API
async function getApertumBalances(wallet) {
    const results = [];
    
    // Get native balance
    try {
        const url = `${APERTUM_EXPLORER_API}?module=account&action=balance&address=${wallet.address}`;
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.status === '1' && data.result) {
            const balance = parseFloat(data.result) / 1e18;
            if (balance > 0) {
                results.push({
                    wallet: wallet.name,
                    walletAddress: wallet.address,
                    tokenSymbol: 'APTM',
                    tokenName: 'APTM',
                    chain: 'apertum',
                    balance: balance,
                    tokenAddress: 'native',
                    decimals: 18,
                    priceUsd: null,
                    valueUsd: null
                });
            }
        }
    } catch (e) {
        console.error('  Error getting APTM balance:', e);
    }
    
    // Get token balances
    const chainTokens = tokens.apertum || [];
    for (const token of chainTokens) {
        if (token.address === 'native') continue;
        
        try {
            const url = `${APERTUM_EXPLORER_API}?module=account&action=tokenbalance&contractaddress=${token.address}&address=${wallet.address}`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.status === '1' && data.result) {
                const balance = parseFloat(data.result) / Math.pow(10, token.decimals);
                if (balance > 0) {
                    results.push({
                        wallet: wallet.name,
                        walletAddress: wallet.address,
                        tokenSymbol: token.symbol,
                        tokenName: token.name,
                        chain: 'apertum',
                        balance: balance,
                        tokenAddress: token.address,
                        decimals: token.decimals,
                        priceUsd: null,
                        valueUsd: null
                    });
                }
            }
            await delay(200);
        } catch (e) {
            console.error(`    ✗ ${token.symbol}:`, e.message);
        }
    }
    
    return results;
}

                    priceUsd: null,
                    valueUsd: null
                });
            }
        }
    } catch (e) {
        console.error('  Error getting ETH balance:', e);
    }
    
    // Get token balances
    const chainTokens = tokens.eth || [];
    for (const token of chainTokens) {
        if (token.address === 'native') continue;
        
        try {
            const url = `${ETHERSCAN_API}?chainid=1&module=account&action=tokenbalance&contractaddress=${token.address}&address=${wallet.address}&tag=latest&apikey=${ETHERSCAN_API_KEY}`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.status === '1' && data.result) {
                const balance = parseFloat(data.result) / Math.pow(10, token.decimals);
                if (balance > 0) {
                    results.push({
                        wallet: wallet.name,
                        walletAddress: wallet.address,
                        tokenSymbol: token.symbol,
                        tokenName: token.name,

                        balance: balance,

        } catch (e) {
            console.error(`    ✗ ${token.symbol}:`, e.message);
        }
    }
    
    return results;
}

// BSC and Polygon using Web3
async function getWeb3Balances(wallet, chain) {
    const results = [];
    const web3 = web3Instances[chain];
    
    // Get native balance
    try {
        const nativeBalance = await web3.eth.getBalance(wallet.address);
        const balance = parseFloat(web3.utils.fromWei(nativeBalance, 'ether'));
        
        if (balance > 0) {
            const nativeTokens = {
                bsc: {symbol: 'BNB', name: 'BNB'},
                polygon: {symbol: 'POL', name: 'POL'}
            };
            const token = nativeTokens[chain];
            results.push({
                wallet: wallet.name,
                walletAddress: wallet.address,
                tokenSymbol: token.symbol,
                tokenName: token.name,
                chain: chain,
                balance: balance,
                tokenAddress: 'native',
                decimals: 18,
                priceUsd: null,
                valueUsd: null
            });
        }
    } catch (e) {
        console.error(`  Error getting native balance:`, e);
    }
    
    // Get token balances
    const chainTokens = tokens[chain] || [];
    for (const token of chainTokens) {
        if (token.address === 'native') continue;
        
        try {
            const contract = new web3.eth.Contract(ERC20_ABI, token.address);
            
            // Get decimals
            let decimals = token.decimals;
            try {
                decimals = await contract.methods.decimals().call();
                decimals = parseInt(decimals);
            } catch {}
            
            // Get balance
            try {
                const rawBalance = await contract.methods.balanceOf(wallet.address).call();
                const balance = parseFloat(rawBalance) / Math.pow(10, decimals);
                
                if (balance > 0) {
                    // Try to get name and symbol from contract
                    let tokenName = token.name;
                    let tokenSymbol = token.symbol;
                    try {
                        const [name, symbol] = await Promise.all([
                            contract.methods.name().call().catch(() => token.name),
                            contract.methods.symbol().call().catch(() => token.symbol)
                        ]);
                        tokenName = name;
                        tokenSymbol = symbol;
                    } catch {}
                    
                    results.push({
                        wallet: wallet.name,
                        walletAddress: wallet.address,
                        tokenSymbol: tokenSymbol,
                        tokenName: tokenName,
                        chain: chain,
                        balance: balance,
                        tokenAddress: token.address,
                        decimals: decimals,
                        priceUsd: null,
                        valueUsd: null
                    });
                }
            } catch {}
            
        } catch (e) {
            console.error(`    ✗ ${token.symbol}:`, e.message);
        }
    }
    
    return results;
}

// Display functions
function displayTable() {
    const c = document.getElementById('tableContent');
    if (allBalances.length === 0) {
        c.innerHTML = '<div class="empty-state"><p>Keine Token mit Balance gefunden.</p></div>';
        return;
    }
    const h = '<div class="table-wrapper"><table><thead><tr><th>Wallet</th><th>Token</th><th>Token-Adresse</th><th>Anzahl</th><th>Preis (USD)</th><th>Wert (USD)</th></tr></thead><tbody id="tableBody">' + generateTableRows() + '</tbody></table></div>';
    c.innerHTML = h;
    populateFilters();
}

function generateTableRows() {
    const gb = document.getElementById('groupByFilter')?.value || 'none';
    if (gb === 'none') {
        return allBalances.map((it, i) => `<tr data-index="${i}"><td>${it.wallet}</td><td><div class="token-info"><div class="token-icon">${it.tokenSymbol.charAt(0)}</div><div class="token-details"><div class="token-symbol">${it.tokenSymbol}</div><div class="token-chain">${it.chain}</div></div></div></td><td class="token-address-cell" title="${it.tokenAddress}">${it.tokenAddress === 'native' ? 'Native' : it.tokenAddress}</td><td class="balance">${formatNumber(it.balance)}</td><td class="balance">${it.priceUsd ? '$' + formatNumber(it.priceUsd) : '-'}</td><td class="balance">${it.valueUsd ? '$' + formatNumber(it.valueUsd) : '-'}</td></tr>`).join('');
    }
