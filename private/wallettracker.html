<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Multi-Wallet Token Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .timestamp { font-size: 14px; opacity: 0.9; }
        .version { font-size: 12px; opacity: 0.7; margin-top: 5px; }
        .login-box { background: white; border-radius: 15px; padding: 40px; max-width: 400px; margin: 100px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .login-box h2 { margin-bottom: 20px; color: #2d3748; }
        .login-box p { margin-bottom: 30px; color: #718096; }
        #google-signin-button { margin: 0 auto; }
        .app-content { display: none; }
        .app-content.loaded { display: block; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .stat-label { font-size: 14px; color: #718096; margin-bottom: 5px; }
        .stat-value { font-size: 28px; font-weight: bold; color: #2d3748; }
        .controls { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .controls label { font-size: 14px; color: #2d3748; font-weight: 600; }
        .controls select { padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; background: white; cursor: pointer; min-width: 150px; }
        .table-wrapper { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f7fafc; position: sticky; top: 0; z-index: 10; }
        th { padding: 15px; text-align: left; font-size: 12px; font-weight: 600; color: #2d3748; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #e2e8f0; }
        tbody tr { border-bottom: 1px solid #e2e8f0; transition: background-color 0.2s; }
        tbody tr:hover { background-color: #f7fafc; }
        td { padding: 12px 15px; font-size: 14px; color: #2d3748; }
        .token-info { display: flex; align-items: center; gap: 10px; }
        .token-icon { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; }
        .token-details { display: flex; flex-direction: column; }
        .token-symbol { font-weight: 600; color: #2d3748; }
        .token-chain { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .token-address-cell { font-family: monospace; font-size: 11px; color: #94a3b8; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .balance { font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-weight: 600; text-align: right; }
        .loading { text-align: center; padding: 60px 20px; color: #667eea; }
        .spinner { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .group-header td { background: #f7fafc; font-weight: 600; padding: 12px 15px; }
        .subtotal-row { background: #fef3c7; font-weight: 600; }
        .total-row { background: #d1fae5; font-weight: bold; font-size: 16px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .error { background: #fee2e2; color: #dc2626; padding: 20px; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Multi-Wallet Token Viewer</h1>
            <div class="version">Version: 09.01.2026 12:57:38 (API V2)</div>
            <div class="timestamp" id="timestamp"></div>
        </div>
        
        <div id="loginBox" class="login-box">
            <h2>Google Anmeldung erforderlich</h2>
            <p>Bitte melde dich mit deinem Google-Konto an.</p>
            <div id="google-signin-button"></div>
            <p id="loginStatus" style="margin-top: 20px; color: #718096; font-size: 14px;"></p>
        </div>
        
        <div id="appContent" class="app-content">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Wallets</div>
                    <div class="stat-value" id="walletCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Tokens</div>
                    <div class="stat-value" id="tokenCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Chains</div>
                    <div class="stat-value" id="chainCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Portfolio-Wert</div>
                    <div class="stat-value" id="portfolioValue">-</div>
                </div>
            </div>

            <div class="controls">
                <label>Wallet:</label>
                <select id="walletFilter"><option value="">Alle Wallets</option></select>
                <label>Chain:</label>
                <select id="chainFilter"><option value="">Alle Chains</option></select>
                <label>Token:</label>
                <select id="tokenFilter"><option value="">Alle Token</option></select>
                <label>Gruppierung:</label>
                <select id="groupByFilter">
                    <option value="none">Keine</option>
                    <option value="wallet">Nach Wallet</option>
                    <option value="chain">Nach Chain</option>
                    <option value="tokenSymbol">Nach Token</option>
                </select>
            </div>
            
            <div id="tableContent"></div>
        </div>
    </div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script>
// Block Explorer APIs (V2 for Etherscan)
const EXPLORER_APIS = {
  bsc: 'https://api.bscscan.com/v2/api',
  eth: 'https://api.etherscan.io/v2/api',
  polygon: 'https://api.polygonscan.com/v2/api',
  apertum: 'https://explorer.apertum.io/api'
};

const API_KEY = 'HTXWS7BQ6F2QJNR4C1QAZW7JFGG2S5PEPZ'; // Etherscan V2 API Key (works for BSC, ETH, Polygon)

const GOOGLE_CONFIG={apiKey:'AIzaSyCoJAYF8BVhYk8k2Zr2MbDAt2qwkaGEM8w',clientId:'42198403966-ovpg5lar1qso4vqfl9rd4ebeunltpegs.apps.googleusercontent.com',spreadsheetId:'1M0HycCitzlkgk_uG1Y-iLeYKthdUaRGnCvv3Hxv0yww',discoveryDocs:['https://sheets.googleapis.com/$discovery/rest?version=v4'],scopes:'https://www.googleapis.com/auth/spreadsheets.readonly'};
let gapiInited=false,tokenClient,accessToken=null,wallets=[],tokens={},allBalances=[];

function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

// Load balances via Block Explorer APIs
async function loadAllWallets(){
try{
console.log('🚀 Starte Laden via Block Explorer APIs...');
const c=document.getElementById('tableContent');
c.innerHTML='<div class="loading"><div class="spinner"></div><p>Lade Token-Daten via Explorer APIs...</p><p style="font-size:12px;margin-top:10px;" id="loadingStatus">Initialisiere...</p></div>';

const se=document.getElementById('loadingStatus');
allBalances=[];

for(const wallet of wallets){
  for(const chain of Object.keys(tokens)){
    se.textContent=`Lade ${wallet.name} auf ${chain.toUpperCase()}...`;
    console.log(`📡 Lade ${wallet.name} auf ${chain}`);
    
    try{
      const balances = await getTokenBalancesFromExplorer(chain, wallet.address, wallet.name);
      allBalances.push(...balances);
      console.log(`  ✓ ${balances.length} Tokens gefunden`);
    }catch(e){
      console.error(`  ✗ Fehler bei ${wallet.name} (${chain}):`, e.message);
    }
    
    await delay(300); // Kurze Pause zwischen Chains
  }
}

console.log(`✅ ${allBalances.length} Token mit Balance gefunden`);
displayTable();
updateStats();

}catch(e){
console.error('Fehler:',e);
displayError('Fehler beim Laden: '+e.message);
}
}

// Get token balances from explorer API
async function getTokenBalancesFromExplorer(chain, address, walletName){
  const results = [];
  
  try{
    // Get native balance first
    const nativeBalance = await getNativeBalanceFromExplorer(chain, address);
    if(nativeBalance > 0){
      const nativeTokens = {
        apertum: {symbol: 'APTM', name: 'APTM'},
        bsc: {symbol: 'BNB', name: 'BNB'},
        eth: {symbol: 'ETH', name: 'ETH'},
        polygon: {symbol: 'POL', name: 'POL'}
      };
      const token = nativeTokens[chain];
      results.push({
        wallet: walletName,
        walletAddress: address,
        tokenSymbol: token.symbol,
        tokenName: token.name,
        chain: chain,
        balance: nativeBalance,
        tokenAddress: 'native',
        decimals: 18,
        priceUsd: null,
        valueUsd: null
      });
    }
    
    // Get ERC20 token balances - only check tokens from our Google Sheet
    const chainTokens = tokens[chain] || [];
    
    for(const sheetToken of chainTokens){
      if(sheetToken.address === 'native') continue; // Skip native, already handled
      
      try{
        const balance = await getTokenBalanceFromExplorer(chain, address, sheetToken.address);
        if(balance > 0){
          const decimals = sheetToken.decimals || 18;
          results.push({
            wallet: walletName,
            walletAddress: address,
            tokenSymbol: sheetToken.symbol,
            tokenName: sheetToken.name,
            chain: chain,
            balance: balance / Math.pow(10, decimals),
            tokenAddress: sheetToken.address,
            decimals: decimals,
            priceUsd: null,
            valueUsd: null
          });
        }
        await delay(200); // Rate limit protection
      }catch(e){
        console.error(`    ✗ ${sheetToken.symbol}:`, e.message);
      }
    }
    
  }catch(e){
    console.error(`Error loading ${chain}:`, e);
  }
  
  return results;
}

// Get native balance from explorer
async function getNativeBalanceFromExplorer(chain, address){
  const apiUrl = EXPLORER_APIS[chain];
  let url;
  
  if(chain === 'apertum'){
    url = `${apiUrl}?module=account&action=balance&address=${address}`;
  }else{
    url = `${apiUrl}?module=account&action=balance&address=${address}&tag=latest&apikey=${API_KEY}`;
  }
  
  const response = await fetch(url);
  const data = await response.json();
  
  if(data.status === '1' && data.result){
    return parseFloat(data.result) / 1e18;
  }
  
  return 0;
}

// Get specific token balance from explorer
async function getTokenBalanceFromExplorer(chain, walletAddr, tokenAddr){
  const apiUrl = EXPLORER_APIS[chain];
  let url;
  
  if(chain === 'apertum'){
    url = `${apiUrl}?module=account&action=tokenbalance&contractaddress=${tokenAddr}&address=${walletAddr}`;
  }else{
    url = `${apiUrl}?module=account&action=tokenbalance&contractaddress=${tokenAddr}&address=${walletAddr}&tag=latest&apikey=${API_KEY}`;
  }
  
  const response = await fetch(url);
  const data = await response.json();
  
  console.log(`  API Response for ${tokenAddr.slice(0,8)}... on ${chain}:`, data);
  
  if(data.status === '1' && data.result){
    const balance = parseFloat(data.result);
    if(balance > 0) console.log(`    ✓ Balance: ${balance}`);
    return balance;
  }
  
  if(data.status === '0'){
    console.log(`    ⚠️ API returned status 0:`, data.message);
  }
  
  return 0;
}

// Google Auth
function gapiLoaded(){gapi.load('client',async()=>{await gapi.client.init({apiKey:GOOGLE_CONFIG.apiKey,discoveryDocs:GOOGLE_CONFIG.discoveryDocs});gapiInited=true;console.log('✓ GAPI initialisiert');maybeEnableButtons();});}
function gisLoaded(){tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CONFIG.clientId,scope:GOOGLE_CONFIG.scopes,redirect_uri:window.location.origin+window.location.pathname,ux_mode:'popup',callback:async(r)=>{if(r.error!==undefined){console.error('Token Error:',r);document.getElementById('loginStatus').textContent='Fehler: '+r.error;return;}console.log('✓ Access Token erhalten');accessToken=r.access_token;await loadSheetsData();document.getElementById('loginBox').style.display='none';document.getElementById('appContent').classList.add('loaded');loadAllWallets();}});console.log('✓ GIS initialisiert');maybeEnableButtons();}
function maybeEnableButtons(){if(gapiInited&&tokenClient){document.getElementById('loginStatus').textContent='Bereit zur Anmeldung';document.getElementById('google-signin-button').innerHTML='<button class="btn btn-primary" onclick="handleAuthClick()" style="width:100%;padding:12px 24px;font-size:16px;background:#667eea;color:white;border:none;border-radius:8px;cursor:pointer;">🔐 Mit Google anmelden</button>';}}
function handleAuthClick(){console.log('🔐 Starte Authentifizierung...');tokenClient.requestAccessToken();}
window.addEventListener('load',()=>{console.log('🔧 Initialisiere Google Auth...');gapiLoaded();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=gisLoaded;s.onerror=()=>{console.error('❌ Google GSI Script konnte nicht geladen werden');document.getElementById('loginStatus').textContent='Fehler: Google Auth konnte nicht geladen werden.';};document.head.appendChild(s);});

// Google Sheets
async function loadSheetsData(){
console.log('📊 Lade Daten aus Google Sheets...');
const wresp=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:GOOGLE_CONFIG.spreadsheetId,range:'Wallets!A2:B'});
const wrows=wresp.result.values||[];
wallets=wrows.map(r=>({name:r[0],address:r[1]}));
console.log(`✓ ${wallets.length} Wallets geladen`);
const tresp=await gapi.client.sheets.spreadsheets.values.get({spreadsheetId:GOOGLE_CONFIG.spreadsheetId,range:'Tokens!A2:E'});
const trows=tresp.result.values||[];
tokens={};
trows.forEach(r=>{const chain=r[0];if(!tokens[chain])tokens[chain]=[];tokens[chain].push({chain:chain,symbol:r[1],name:r[2],address:r[3],decimals:r[4]?parseInt(r[4]):null});});
console.log(`✓ ${trows.length} Tokens geladen`);
}

// Display
function displayTable(){
const c=document.getElementById('tableContent');
if(allBalances.length===0){c.innerHTML='<div class="empty-state"><p>Keine Token mit Balance gefunden.</p></div>';return;}
const h='<div class="table-wrapper"><table><thead><tr><th>Wallet</th><th>Token</th><th>Token-Adresse</th><th>Anzahl</th></tr></thead><tbody id="tableBody">'+generateTableRows()+'</tbody></table></div>';
c.innerHTML=h;
populateFilters();
}

function generateTableRows(){
const gb=document.getElementById('groupByFilter')?.value||'none';
if(gb==='none'){
return allBalances.map((it,i)=>`<tr data-index="${i}"><td>${it.wallet}</td><td><div class="token-info"><div class="token-icon">${it.tokenSymbol.charAt(0)}</div><div class="token-details"><div class="token-symbol">${it.tokenSymbol}</div><div class="token-chain">${it.chain}</div></div></div></td><td class="token-address-cell" title="${it.tokenAddress}">${it.tokenAddress==='native'?'Native':it.tokenAddress}</td><td class="balance">${formatNumber(it.balance)}</td></tr>`).join('');
}else{
const g={};
allBalances.forEach((it,i)=>{const k=it[gb]||'Unbekannt';if(!g[k])g[k]=[];g[k].push({...it,originalIndex:i});});
let h='';
Object.keys(g).sort().forEach(k=>{
const its=g[k];
h+=`<tr class="group-header"><td colspan="4"><strong>${getGroupLabel(gb)}:</strong> ${k.toUpperCase()}</td></tr>`;
its.forEach(it=>{h+=`<tr data-index="${it.originalIndex}"><td>${it.wallet}</td><td><div class="token-info"><div class="token-icon">${it.tokenSymbol.charAt(0)}</div><div class="token-details"><div class="token-symbol">${it.tokenSymbol}</div><div class="token-chain">${it.chain}</div></div></div></td><td class="token-address-cell" title="${it.tokenAddress}">${it.tokenAddress==='native'?'Native':it.tokenAddress}</td><td class="balance">${formatNumber(it.balance)}</td></tr>`;});
});
return h;
}
}

function getGroupLabel(gb){const l={'wallet':'Wallet','chain':'Chain','tokenSymbol':'Token'};return l[gb]||gb;}

function populateFilters(){
const uw=[...new Set(allBalances.map(i=>i.wallet))].sort();
const wf=document.getElementById('walletFilter');
wf.innerHTML='<option value="">Alle Wallets</option>';
uw.forEach(w=>{wf.innerHTML+=`<option value="${w}">${w}</option>`;});
const uc=[...new Set(allBalances.map(i=>i.chain))].sort();
const cf=document.getElementById('chainFilter');
cf.innerHTML='<option value="">Alle Chains</option>';
uc.forEach(c=>{cf.innerHTML+=`<option value="${c}">${c.toUpperCase()}</option>`;});
const ut=[...new Set(allBalances.map(i=>i.tokenSymbol))].sort();
const tf=document.getElementById('tokenFilter');
tf.innerHTML='<option value="">Alle Token</option>';
ut.forEach(t=>{tf.innerHTML+=`<option value="${t}">${t}</option>`;});
}

function applyFilters(){
const wf=document.getElementById('walletFilter').value;
const cf=document.getElementById('chainFilter').value;
const tf=document.getElementById('tokenFilter').value;
const fb=allBalances.filter(i=>{const mw=!wf||i.wallet===wf;const mc=!cf||i.chain===cf;const mt=!tf||i.tokenSymbol===tf;return mw&&mc&&mt;});
const tmp=allBalances;
allBalances=fb;
const tbody=document.getElementById('tableBody');
if(tbody){tbody.parentElement.parentElement.innerHTML='<table><thead><tr><th>Wallet</th><th>Token</th><th>Token-Adresse</th><th>Anzahl</th></tr></thead><tbody id="tableBody">'+generateTableRows()+'</tbody></table>';}
allBalances=tmp;
updateStatsFiltered(fb);
}

function updateStats(){
document.getElementById('walletCount').textContent=wallets.length;
document.getElementById('tokenCount').textContent=allBalances.length;
document.getElementById('chainCount').textContent=Object.keys(tokens).length;
const tv=allBalances.reduce((s,i)=>s+(i.valueUsd||0),0);
document.getElementById('portfolioValue').textContent=tv>0?'$'+formatNumber(tv):'-';
}

function updateStatsFiltered(fb){
const uw=new Set(fb.map(i=>i.wallet));
document.getElementById('walletCount').textContent=uw.size;
document.getElementById('tokenCount').textContent=fb.length;
const uc=new Set(fb.map(i=>i.chain));
document.getElementById('chainCount').textContent=uc.size;
const tv=fb.reduce((s,i)=>s+(i.valueUsd||0),0);
document.getElementById('portfolioValue').textContent=tv>0?'$'+formatNumber(tv):'-';
}

function formatNumber(n){
if(n===null||n===undefined)return'-';
let d;
if(n>=1000)d=2;
else if(n>=1)d=4;
else if(n>=0.01)d=6;
else d=8;
const f=n.toFixed(d);
const p=f.split('.');
const ip=p[0];
const dp=p[1];
const fi=ip.replace(/\B(?=(\d{3})+(?!\d))/g,"'");
return dp?`${fi}.${dp}`:fi;
}

function displayError(m){const c=document.getElementById('tableContent');c.innerHTML=`<div class="error">${m}</div>`;}

// Event Listeners
document.getElementById('walletFilter').addEventListener('change',applyFilters);
document.getElementById('chainFilter').addEventListener('change',applyFilters);
document.getElementById('tokenFilter').addEventListener('change',applyFilters);
document.getElementById('groupByFilter').addEventListener('change',applyFilters);

// Timestamp
setInterval(()=>{document.getElementById('timestamp').textContent=new Date().toLocaleString('de-CH');},1000);
    </script>
</body>
</html>
