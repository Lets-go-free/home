<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Multi-Wallet Token Viewer – Cached</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, -apple-system;
  background:#0f172a;
  color:#e5e7eb;
  padding:20px;
}
h1 { margin-bottom:4px }
small { color:#94a3b8 }

table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th, td {
  padding:10px;
  border-bottom:1px solid #334155;
}
th { text-align:left; color:#cbd5f5 }
td { text-align:right }

.up { color:#22c55e }
.down { color:#ef4444 }
.neutral { color:#94a3b8 }
</style>
</head>

<body>

<h1>🔐 Multi-Wallet Token Viewer</h1>
<small>Preis-Caching + 24h-Change · CoinGecko + DexScreener</small>

<div id="output">Lade Daten…</div>

<script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>

<script>
/* ======================================================
   CONFIG
====================================================== */

// RPCs (nur EVM)
const RPC = {
  eth: 'https://eth.llamarpc.com',
  polygon: 'https://polygon-rpc.com',
  bsc: 'https://bsc-dataseed.binance.org/',
  apertum: 'https://rpc.apertum.io/ext/bc/YDJ1r9RMkewATmA7B35q1bdV18aywzmdiXwd9zGBq3uQjsCnn/rpc'
};

// CoinGecko IDs
const COINGECKO = {
  eth: 'ethereum',
  bsc: 'binancecoin',
  polygon: 'polygon-ecosystem-token',
  apertum: 'apertum',

  btc: 'bitcoin',
  sol: 'solana',
  xrp: 'ripple',
  ada: 'cardano'
};

// DexScreener Chains
const DEX_CHAIN = {
  eth: 'ethereum',
  bsc: 'bsc',
  polygon: 'polygon'
};

// Wallets (Beispiel)
const wallets = [
  { name:'Main', address:'0x000000000000000000000000000000000000dead' }
];

// Tokens
const tokens = {
  eth: [{ symbol:'ETH', address:'native' }],
  polygon: [{ symbol:'POL', address:'native' }],
  apertum: [{ symbol:'APTM', address:'native' }],

  nonEvm: [
    { symbol:'BTC', chain:'btc' },
    { symbol:'SOL', chain:'sol' },
    { symbol:'XRP', chain:'xrp' }
  ]
};

/* ======================================================
   WEB3
====================================================== */
const web3 = {};
for (const c in RPC) web3[c] = new Web3(RPC[c]);

/* ======================================================
   PRICE CACHE (localStorage)
====================================================== */

const CACHE_TTL = 60_000; // 60 Sekunden

function getCache(key) {
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  const data = JSON.parse(raw);
  if (Date.now() - data.time > CACHE_TTL) return null;
  return data;
}

function setCache(key, value) {
  localStorage.setItem(key, JSON.stringify({
    ...value,
    time: Date.now()
  }));
}

/* ======================================================
   PRICE FETCH
====================================================== */

async function fetchCoingecko(id) {
  const cacheKey = `cg_${id}`;
  const cached = getCache(cacheKey);
  if (cached) return cached;

  const url =
    `https://api.coingecko.com/api/v3/simple/price` +
    `?ids=${id}&vs_currencies=usd&include_24hr_change=true`;

  const r = await fetch(url);
  const j = await r.json();
  if (!j[id]) return null;

  const data = {
    price: j[id].usd,
    change24h: j[id].usd_24h_change
  };
  setCache(cacheKey, data);
  return data;
}

async function fetchDex(tokenAddress, chain) {
  const cacheKey = `dex_${chain}_${tokenAddress}`;
  const cached = getCache(cacheKey);
  if (cached) return cached;

  const r = await fetch(
    `https://api.dexscreener.com/latest/dex/tokens/${tokenAddress}`
  );
  const j = await r.json();
  if (!j.pairs) return null;

  const pairs = j.pairs.filter(p => p.chainId === DEX_CHAIN[chain]);
  if (!pairs.length) return null;

  const best = pairs.sort(
    (a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0)
  )[0];

  const data = {
    price: parseFloat(best.priceUsd),
    change24h: parseFloat(best.priceChange?.h24 ?? 0)
  };
  setCache(cacheKey, data);
  return data;
}

/* ======================================================
   LOAD DATA
====================================================== */

async function load() {
  const rows = [];

  // EVM native tokens
  for (const chain in tokens) {
    if (chain === 'nonEvm') continue;

    for (const t of tokens[chain]) {
      for (const w of wallets) {
        let balance = 0;

        if (t.address === 'native') {
          const wei = await web3[chain].eth.getBalance(w.address);
          balance = parseFloat(Web3.utils.fromWei(wei));
        }

        if (balance > 0) {
          const priceData = await fetchCoingecko(COINGECKO[chain]);
          rows.push({
            wallet: w.name,
            token: t.symbol,
            chain,
            balance,
            ...priceData
          });
        }
      }
    }
  }

  // Non-EVM coins (Preis only)
  for (const t of tokens.nonEvm) {
    const priceData = await fetchCoingecko(COINGECKO[t.chain]);
    rows.push({
      wallet: '—',
      token: t.symbol,
      chain: t.chain,
      balance: '—',
      ...priceData
    });
  }

  render(rows);
}

/* ======================================================
   RENDER
====================================================== */

function render(rows) {
  let html = `<table>
    <tr>
      <th>Wallet</th>
      <th>Token</th>
      <th>Chain</th>
      <th>Balance</th>
      <th>Preis (USD)</th>
      <th>24h</th>
      <th>Wert (USD)</th>
    </tr>`;

  rows.forEach(r => {
    const changeClass =
      r.change24h > 0 ? 'up' :
      r.change24h < 0 ? 'down' : 'neutral';

    const value =
      typeof r.balance === 'number' && r.price
        ? (r.balance * r.price).toFixed(2)
        : '—';

    html += `<tr>
      <td>${r.wallet}</td>
      <td>${r.token}</td>
      <td>${r.chain.toUpperCase()}</td>
      <td>${typeof r.balance === 'number' ? r.balance.toFixed(6) : '—'}</td>
      <td>${r.price ? '$'+r.price.toFixed(4) : '—'}</td>
      <td class="${changeClass}">
        ${r.change24h ? r.change24h.toFixed(2)+'%' : '—'}
      </td>
      <td>${value !== '—' ? '$'+value : '—'}</td>
    </tr>`;
  });

  html += '</table>';
  document.getElementById('output').innerHTML = html;
}

load();
</script>

</body>
</html>
